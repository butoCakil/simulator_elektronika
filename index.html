/* Ikon dibuat dengan MEMANGGIL fungsi simbol yang sama seperti di skema,
   bukan menggambar ulang bentuk terpisah. Jadi ikon dijamin selalu sama
   dengan simbol aslinya, termasuk kalau simbolnya nanti diubah. */
function gambarIkon(jenis,kanvas,lebar,tinggi){
  const def=JENIS[jenis];
  const c=kanvas.getContext('2d');
  const dpr=Math.min(devicePixelRatio||1,2.5);
  kanvas.width=Math.round(lebar*dpr); kanvas.height=Math.round(tinggi*dpr);
  const simpan={ctx,zoom,hasil,proyektor,ikonMode,skalaGaris,kompAktif};
  ctx=c; hasil=null; proyektor=false; ikonMode=true; kompAktif=null;
  const b=def.kotak, w=Math.max(b[2]-b[0],1), h=Math.max(b[3]-b[1],1);
  const sk=Math.min((lebar-8)/w,(tinggi-8)/h,0.62);
  zoom=sk; skalaGaris=1/sk;          /* garis tetap setebal semestinya di layar */
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,lebar,tinggi);
  c.save();
  c.translate(lebar/2,tinggi/2); c.scale(sk,sk);
  c.translate(-(b[0]+b[2])/2,-(b[1]+b[3])/2);
  try{
    def.gambar({id:'#ikon',jenis,x:0,y:0,rot:0,
                prop:Object.assign({},def.prop),pin:def.pin.map(()=>0)});
  }catch(_){ /* satu ikon gagal tidak boleh menjatuhkan palet */ }
  c.restore();
  ctx=simpan.ctx; zoom=simpan.zoom; hasil=simpan.hasil;
  proyektor=simpan.proyektor; ikonMode=simpan.ikonMode;
  skalaGaris=simpan.skalaGaris; kompAktif=simpan.kompAktif;
}

function kotakKomponen(k,warna,tebal,putus){
  const [x0,y0,x1,y1]=JENIS[k.jenis].kotak, pad=px(PAD_BADAN);
  ctx.save(); ctx.translate(k.x,k.y); ctx.rotate(k.rot*Math.PI/2);
  if(k.cx) ctx.scale(-1,1);
  ctx.strokeStyle=warna; ctx.lineWidth=tebal;
  if(putus) ctx.setLineDash([px(5),px(4)]);
  ctx.strokeRect(x0-pad,y0-pad,(x1-x0)+pad*2,(y1-y0)+pad*2);
  ctx.setLineDash([]); ctx.restore();
}

const geser=new Map(); const SPASI=20, K_LAJU=1100, LAJU_MAKS=300;
function panjang(pts){let t=0;for(let i=0;i<pts.length-1;i++)
  t+=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);return t}
function titikDi(pts,d){
  let s=d;
  for(let i=0;i<pts.length-1;i++){
    const dx=pts[i+1][0]-pts[i][0],dy=pts[i+1][1]-pts[i][1],L=Math.hypot(dx,dy);
    if(s<=L) return [pts[i][0]+dx/L*s, pts[i][1]+dy/L*s];
    s-=L;
  }
  return pts[pts.length-1];
}
function muatan(pts,off){
  const t=panjang(pts); if(t<1) return;
  ctx.fillStyle=C.charge;
  for(let d=((off%SPASI)+SPASI)%SPASI;d<t;d+=SPASI){
    const [x,y]=titikDi(pts,d);
    ctx.beginPath();ctx.arc(x,y,2.6*FP(),0,6.2832);ctx.fill();
  }
}
/* penanda genggam di tengah tiap segmen kawat terpilih */
function genggamKawat(pts){
  for(let j=0;j<pts.length-1;j++){
    const [ax,ay]=pts[j],[bx,by]=pts[j+1];
    const L=Math.hypot(bx-ax,by-ay); if(L<16) continue;
    const mx=(ax+bx)/2, my=(ay+by)/2, tegak=Math.abs(bx-ax)<1e-6;
    const r=px(5.5);
    ctx.strokeStyle=C.pilih; ctx.lineWidth=px(1.8);
    for(const o of [-r,r]){
      ctx.beginPath();
      if(tegak){ctx.moveTo(mx+o,my-r);ctx.lineTo(mx+o,my+r)}
      else     {ctx.moveTo(mx-r,my+o);ctx.lineTo(mx+r,my+o)}
      ctx.stroke();
    }
  }
}

function gambar(){
  periksaUkuran();
  labelAntri.length=0;
  ctx.save();
  ctx.fillStyle=C['panel-dark'];ctx.fillRect(0,0,lebarCSS,tinggiCSS);
  ctx.translate(-pan.x*zoom,-pan.y*zoom); ctx.scale(zoom,zoom);

  const x0=bulat(pan.x)-KISI, y0=bulat(pan.y)-KISI;
  const x1=pan.x+lebarCSS/zoom+KISI, y1=pan.y+tinggiCSS/zoom+KISI;
  ctx.fillStyle='rgba(127,160,163,.20)';
  const sp=px(1.2);
  for(let x=x0;x<x1;x+=KISI) for(let y=y0;y<y1;y+=KISI) ctx.fillRect(x-sp/2,y-sp/2,sp,sp);

  const mati=!hidup||!hasil||!hasil.ok;
  const wk=mati?'rgba(184,115,51,.45)':C.copper;

  M.kawat.forEach((w,i)=>{
    const p=posPinKunci(w.a),q=posPinKunci(w.b); if(!p||!q) return;
    w.jalur=jalurKawat(w,p,q);
    const dipl=i===pilihKawat, hov=sorot&&sorot.t==='kawat'&&sorot.i===i;
    garisJalur(w.jalur, dipl?C.pilih:(hov?C.silk:wk), dipl?3.6:2.4);
  });
  if(!mati){
    M.kawat.forEach((w,i)=>{
      const I=hasil.arusKawat.get(i)||0;
      muatan(Math.sign(I)>=0?w.jalur:[...w.jalur].reverse(), geser.get('w'+i)||0);
    });
    for(const k of M.komponen){
      if(k.pin.length<2) continue;
      let p,q,I;
      if(k.jenis==='npn'||k.jenis==='pnp'){
        /* jalur utama transistor adalah kolektor -> emitor */
        I=hasil.arusKomp.get(k.id)||0; p=posPin(k,1); q=posPin(k,2);
      }else if(k.jenis==='trafo'){
        I=hasil.arusKomp.get(k.id+'#s')||0; p=posPin(k,2); q=posPin(k,3);
      }else if(k.jenis==='potensio'){
        I=hasil.arusKomp.get(k.id+'#a')||0; p=posPin(k,0); q=posPin(k,2);
      }else if(k.jenis==='opamp'){
        continue;
      }else{
        I=hasil.arusKomp.get(k.id)||0; p=posPin(k,0); q=posPin(k,1);
      }
      muatan(Math.sign(I)>=0?[p,q]:[q,p], geser.get(k.id)||0);
    }
  }
  if(pilihKawat>=0&&M.kawat[pilihKawat]) genggamKawat(M.kawat[pilihKawat].jalur||[]);

  if(sorot&&sorot.t==='badan') kotakKomponen(sorot.k,'rgba(232,226,208,.35)',px(1.2),false);
  if(modeTampil&2) for(const k of M.komponen) kotakKomponen(k,'rgba(99,164,140,.5)',px(1),false);

  for(const k of M.komponen){
    ctx.save(); ctx.translate(k.x,k.y); ctx.rotate(k.rot*Math.PI/2);
    if(k.cx) ctx.scale(-1,1);
    kompAktif=k;                      /* agar label tahu cara memutar posisinya */
    JENIS[k.jenis].gambar(k);
    kompAktif=null;
    ctx.restore();
  }
  for(const k of M.komponen) k.pin.forEach((_,i)=>{
    const [x,y]=posPin(k,i);
    ctx.fillStyle=C.copper;
    ctx.beginPath();ctx.arc(x,y,px(3*FP()),0,6.2832);ctx.fill();
  });
  if(dipilih) kotakKomponen(dipilih,C.pilih,px(1.5),true);

  for(const k of peganganAktif()) k.pin.forEach((_,i)=>{
    const kunci=k.id+':'+i;
    const [pxx,pyy]=posPin(k,i), [hx,hy]=posPegangan(k,i);
    const aktif=pinTertunda===kunci;
    const hov=sorot&&sorot.t==='pegangan'&&sorot.kunci===kunci;
    if(JAUH_PEGANGAN>0) garisJalur([[pxx,pyy],[hx,hy]],'rgba(134,182,222,.5)',px(1.4));
    const r=px((hov||aktif?11:9)*FP());
    ctx.fillStyle=aktif?C.pilih:C['panel-dark'];
    ctx.beginPath();ctx.arc(hx,hy,r,0,6.2832);ctx.fill();
    ctx.strokeStyle=C.pilih;ctx.lineWidth=px(aktif?3:2);
    ctx.beginPath();ctx.arc(hx,hy,r,0,6.2832);ctx.stroke();
    tks(String(i+1),hx,hy,aktif?C['panel-dark']:C.pilih,10,'center',3);
  });

  if((modeTampil&1)&&!mati){
    const sudah=new Set();
    for(const k of M.komponen) k.pin.forEach((_,i)=>{
      const n=hasil.net.petaSimpul.get(k.id+':'+i);
      if(n===undefined||sudah.has(n)) return;
      sudah.add(n);
      const [x,y]=posPin(k,i);
      tks(km(hasil.V[n],2)+' V', x+11/zoom, y-15/zoom, C.silk,10,'left',0);
    });
    for(const k of M.komponen){
      if(k.pin.length<2||k.jenis==='volt'||k.jenis==='ampere'||k.jenis==='opamp'
         ||k.jenis==='npn'||k.jenis==='pnp'||k.jenis==='trafo'||k.jenis==='potensio') continue;
      const [x,y]=putar(k,0,JENIS[k.jenis].kotak[3]);
      tks(fmtA(hasil.arusKomp.get(k.id)||0), x, y+px(13), C.silk,10);
    }
  }
  ctx.restore();
  /* seluruh label digambar di sini, di ruang layar: tegak, berukuran tetap,
     dan sudah saling menghindar */
  tempatkanLabel();

  /* penunjuk waktu simulasi — hanya berarti bila ada kapasitor/induktor */
  if(perluWaktu(M)){
    ctx.font=(11*FP())+'px ui-monospace, monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillStyle=hidup?C.silk:C.muted;
    ctx.fillText('t = '+fmtWaktu(tSim)+'   ×'+km(SKALA[iSkala],2).replace(',00','')+
      ((hasil&&hasil.terpotong)?'  (hitungan tertinggal)':'')+
      ((hasil&&hasil.gagal)?'   iterasi belum konvergen: '+hasil.gagal+' langkah':'')+
      (jeda?'   — JEDA':''),10,10);
  }
}

/* ==========================================================================
   7. FORMAT
   ========================================================================== */
/* Jaring pengaman: satu nilai bukan-angka pernah mematikan seluruh putaran
   gambar lewat undefined.toFixed. Lebih baik menampilkan 0 daripada mati. */
const km=(x,d)=>(Number.isFinite(x)?x:0).toFixed(d).replace('.',',');
const fmtOhm=r=>r>=1000?km(r/1000,r%1000?1:0)+' kΩ':r+' Ω';
/* diminta: kapasitor paling besar tampil dalam µF, jangan mF */
const fmtF=c=>c<1?km(c*1000,0)+' nF':km(c,c<10?1:0)+' µF';
const fmtHz=f=>f>=1000?km(f/1000,f%1000?1:0)+' kHz':km(f,f<10?1:0)+' Hz';
/* diminta: induktor paling besar tampil dalam mH, jangan H */
const fmtH=l=>km(l,l<10?1:0)+' mH';
function fmtWaktu(t){
  if(t<1e-3) return km(t*1e6,1)+' µs';
  if(t<1) return km(t*1e3,2)+' ms';
  return km(t,3)+' s';
}
function fmtA(i){
  const a=Math.abs(i);
  if(a<1e-10) return '0 A';
  if(a<1e-6)  return km(i*1e9,a<1e-8?1:0)+' nA';
  if(a<1e-3)  return km(i*1e6,a<1e-5?1:0)+' µA';
  if(a<1)     return km(i*1000,a<1e-2?2:1)+' mA';
  return km(i,3)+' A';
}
const fmtVolt=v=>Math.abs(v)<1?km(v*1000,Math.abs(v*1000)<10?1:0)+' mV'
                             :km(v,Math.abs(v)<10?1:0)+' V';

    baris.style.cssText='display:flex;gap:8px;margin-top:11px';
    const br=document.createElement('button'); br.textContent='Rapikan jalur'; br.style.flex='1';
    br.addEventListener('click',()=>{
      rekam(); delete w.orient; delete w.m; gambarIns();
    });
    const bh=document.createElement('button'); bh.textContent='Hapus kawat'; bh.style.flex='1';
    bh.style.borderColor=C.hot; bh.style.color=C.hot;

      'membuat <b>titik cabang</b>. Tuas saklar ditekan langsung di kanvas. '+
      'Sekali ketuk pada alat ukur membuka layar osiloskop di atas, tanpa panel ini.</p>'+
      '<p class="lbl" style="margin:14px 0 5px">Nama rangkaian</p>'+
      '<input type="text" id="inNamaProyek" maxlength="60" value="'+
        String(namaProyek).replace(/"/g,'&quot;')+'">'+
      '<p class="kosong" style="margin-top:5px">Dipakai sebagai nama berkas saat disimpan.</p>'+
      '<p class="lbl" style="margin:14px 0 7px">Arti warna</p>'+
      '<p class="kosong" style="line-height:1.9">'+
      '<i style="display:inline-block;width:13px;height:3px;background:'+C.copper+
        ';vertical-align:middle;margin-right:7px"></i>kawat &amp; badan komponen<br>'+
      '<i style="display:inline-block;width:13px;height:3px;background:'+C.charge+
        ';vertical-align:middle;margin-right:7px"></i>arus dan muatan<br>'+
      '<i style="display:inline-block;width:13px;height:3px;background:'+C.silk+
        ';vertical-align:middle;margin-right:7px"></i>tegangan<br>'+
      '<i style="display:inline-block;width:13px;height:3px;background:'+C.ok+
        ';vertical-align:middle;margin-right:7px"></i>alat ukur<br>'+
      '<i style="display:inline-block;width:13px;height:3px;background:'+C.pilih+
        ';vertical-align:middle;margin-right:7px"></i>pilihan &amp; kendali</p>';
    const inNm=document.getElementById('inNamaProyek');
    if(inNm) inNm.addEventListener('change',()=>{
      namaProyek=inNm.value.trim()||namaProyek; inNm.value=namaProyek;
    });
    return;
  }
  const def=JENIS[dipilih.jenis];

  const jd=document.createElement('p'); jd.className='lbl';
  jd.textContent=def.nama+' · '+dipilih.id; elIns.appendChild(jd);

  /* Voltmeter dan amperemeter tidak otomatis menjadi kanal skop. Ia
     diaktifkan dari sini — sengaja lewat tombol tersendiri, bukan lewat
     daftar sifat, supaya jelas bahwa ini menyalakan perekaman. */
  if(dipilih.jenis==='volt'||dipilih.jenis==='ampere'){
    const bs=document.createElement('button');
    bs.style.cssText='width:100%;margin-bottom:12px';
    const pasang=()=>{
      bs.textContent=dipilih.prop.skop?'▲ Tampil di skop — aktif':'Tampilkan di skop';

      else { jejak.delete(dipilih.id); setelanKanal.delete(dipilih.id) }
      sigCtl=''; pasang(); segarkan();
    });

  }

  def.field.forEach(f=>{
    const box=document.createElement('div'); box.className='fld';
    const nm=document.createElement('span'); nm.className='nm'; nm.textContent=f.nm;
    box.appendChild(nm);
    if(f.jenis==='angka'){
      const duo=document.createElement('div'); duo.className='duo';
      const inp=document.createElement('input');
      inp.type='number';inp.min=f.min;inp.max=f.max;inp.step=f.step;inp.value=dipilih.prop[f.k];
      const sat=document.createElement('span'); sat.className='sat'; sat.textContent=f.sat||'';
      duo.append(inp,sat); box.appendChild(duo);
      const sl=document.createElement('input');
      sl.type='range';
      /* Rentang selebar 1 Ω .. 10 MΩ mustahil diatur dengan geseran linear:
         setengah pertama geseran hanya mencakup 5 ohm. Karena itu geserannya
         logaritmik, sedangkan kotak angkanya tetap bebas diketik. */
      const lo=Math.log10(Math.max(f.min,1e-9)), hi=Math.log10(f.max);
      const keGeser=v=>Math.round((Math.log10(Math.min(Math.max(v,f.min),f.max))-lo)/(hi-lo)*1000);
      const dariGeser=g=>{
        const v=Math.pow(10,lo+(hi-lo)*g/1000);
        const p=Math.pow(10,Math.floor(Math.log10(v))-1);
        return Math.max(Math.round(v/p)*p,f.min);      /* 2 angka berarti */
      };
      if(f.log){ sl.min=0; sl.max=1000; sl.step=1; sl.value=keGeser(dipilih.prop[f.k]) }
      else { sl.min=f.min; sl.max=f.max; sl.step=f.step; sl.value=dipilih.prop[f.k] }
      box.appendChild(sl);
      inp.addEventListener('change',()=>{
        const n=Math.min(Math.max(parseFloat(inp.value)||0,f.min),f.max);
        rekam(); dipilih.prop[f.k]=n; segarkan(); gambarIns();
      });
      sl.addEventListener('input',()=>{
        const v=f.log?dariGeser(+sl.value):parseFloat(sl.value);
        dipilih.prop[f.k]=v; inp.value=v; segarkan();
      });
      sl.addEventListener('change',()=>{rekam();gambarIns()});

    }else{
      const sel=document.createElement('select');

      });

    }

  });

  const nmP=document.createElement('span'); nmP.className='nm';

  dipilih.pin.forEach((_,i)=>{
    const b=document.createElement('button');
    b.textContent='Pin '+(i+1);

    if(pinTertunda===kunci) b.setAttribute('aria-pressed','true');

  });
  elIns.appendChild(pb);

  const nmA=document.createElement('span'); nmA.className='nm';
  nmA.textContent='Pindah selangkah kisi'; elIns.appendChild(nmA);
  const ar=document.createElement('div'); ar.className='arah';
  [['←',-KISI,0],['→',KISI,0],['↑',0,-KISI],['↓',0,KISI]].forEach(([t,dx,dy])=>{
    const b=document.createElement('button'); b.textContent=t;
    b.addEventListener('click',()=>{rekam();dipilih.x+=dx;dipilih.y+=dy;segarkan()});
    ar.appendChild(b);
  });
  elIns.appendChild(ar);

  const aksiEl=document.createElement('div');
  aksiEl.style.cssText='display:flex;gap:8px;margin-top:11px';
  const bp=document.createElement('button'); bp.style.flex='1';
  bp.innerHTML='<svg class="ik" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-8-8"/>'+
    '<path d="M12 1.5V6.5L16 4"/></svg><span>Putar 90°</span>';
  bp.addEventListener('click',()=>{rekam();dipilih.rot=(dipilih.rot+1)%4;segarkan()});
  /* Cermin tegak = cermin datar + putar 180 derajat, jadi cukup satu penanda. */

  bh.addEventListener('click',()=>{rekam();hapusKomponen(dipilih.id);pilihKomp(null);segarkan()});

/* ==========================================================================
   8b. OSILOSKOP — setiap kanal diskalakan sendiri (seperti gain per kanal
       pada osiloskop nyata), karena volt dan ampere tak bisa satu sumbu.
   ========================================================================== */
const sc=document.getElementById('scope'), sctx=sc.getContext('2d');
const skopbar=document.getElementById('skopbar');
const bSkop=document.getElementById('bSkop');
const IK_SKOP='<svg class="ik" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M5.5 14c2-6 4 6 6 0s3-4 4 2"/></svg>';
const IK_TUTUP='<svg class="ik" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function bukaScope(b){
  skopbar.classList.toggle('buka',b);
  bSkop.setAttribute('aria-pressed',String(b));
  /* Tombol SKOP sekaligus menjadi tombol tutup: tanda silang tersendiri di
     dalam layar skop hanya memakan tempat. */

  if(sv) sv.outerHTML = b?IK_TUTUP:IK_SKOP;

  if(sp) sp.textContent = b?'TUTUP':'SKOP';
}
bSkop.addEventListener('click',()=>bukaScope(!skopbar.classList.contains('buka')));

let scL=0,scT=0;

/* basis waktu, seperti kenop TIME/DIV. 0 = seluruh rekaman. */
/* Basis waktu bergaya osiloskop: urutan 1-2-5 dari 100 µs sampai 5 s, plus
   "Semua" untuk melihat seluruh rekaman. Diatur dengan panah kiri/kanan,
   bukan satu tombol yang harus diputar melewati semua nilai. */
const JENDELA=[0,5,2,1,.5,.2,.1,.05,.02,.01,.005,.002,.001,.0005,.0002,.0001];
let iJendela=0;
const labelJendela=()=>{};
/* Penggeser sinyal kiri-kanan, dalam satuan divisi dan BERNILAI PECAHAN.
   Osiloskop nyata memakai potensiometer, jadi langkah satu divisi terlalu
   kasar untuk menempatkan puncak gelombang tepat di garis kisi. */
let posDivT=0;
const GESER_MAKS=40;       /* divisi ke belakang yang bisa dijangkau kenop.
                              Menentukan kehalusan PELUNCUR: jangkauan dibagi
                              lebar peluncur. 40 -> ~0,3 divisi per piksel. */
const LANGKAH_HALUS=0.01;  /* langkah tombol ◀ ▶ dan ▼ ▲, dalam divisi */

/* ===== setelan tiap kanal: VOLTS/DIV dan POSITION ========================
   Tanpa keduanya, sinyal 20 mV di samping sinyal 4 V hanya tampak sebagai
   garis lurus — persis keluhan pada rangkaian penguat. Kisi 8 divisi tegak
   mengikuti kebiasaan osiloskop.
   ========================================================================= */
/* Dua deret skala, karena kanal amperemeter bersatuan ampere. Kisi skop
   tidak berlabel nilai mutlak — tiap kanal membawa labelnya sendiri —
   sehingga mencampur satuan tetap terbaca, seperti osiloskop dengan probe
   arus. */
const VDIV_V=[.0005,.001,.002,.005,.01,.02,.05,.1,.2,.5,1,2,5,10,20,50];
const VDIV_A=[1e-6,2e-6,5e-6,1e-5,2e-5,5e-5,1e-4,2e-4,5e-4,
              1e-3,2e-3,5e-3,1e-2,2e-2,5e-2,.1,.2,.5,1,2,5];
const NDIV_Y=8, NDIV_X=10;
const setelanKanal=new Map();               /* id -> {iv,pos,ac,sat} */
const deret=st=>(st&&st.sat==='A')?VDIV_A:VDIV_V;
const iVdivUntuk=(v,arr)=>{
  if(!Number.isFinite(v)||v<=0) return 0;      /* jangan sampai memilih skala terbesar */
  for(let i=0;i<arr.length;i++) if(arr[i]>=v) return i;
  return arr.length-1;
};
function fmtVdiv(v,sat){
  if(sat==='A'){
    if(v<1e-3) return km(v*1e6,v*1e6<10?1:0)+' µA/div';
    if(v<1)    return km(v*1e3,v*1e3<10?1:0)+' mA/div';
    return km(v,v<10?1:0)+' A/div';
  }
  return (v<1 ? km(v*1000,v*1000<10?1:0)+' mV' : km(v,v<10?1:0)+' V')+'/div';
}
const fmtNilai=(v,sat)=>sat==='A'?fmtA(v):km(v,3)+' V';
const FMT_OPSI={ohm:fmtOhm,farad:fmtF,henry:fmtH,volt:fmtVolt,hz:fmtHz};
/* Sebar kanal ke jatah divisinya masing-masing supaya tidak tumpang tindih,
   lalu pilih V/div supaya ayunannya mengisi jatah itu. */
function idealKanal(k,i,n){
  const jatah=NDIV_Y/n, arr=k.sat==='A'?VDIV_A:VDIV_V;
  const ayun=k.maks-k.min;
  const acuan = ayun>1e-9 ? ayun : Math.max(Math.abs((k.maks+k.min)/2),arr[0]*2);
  const iv=iVdivUntuk(acuan/(jatah*0.7),arr);
  const tengah=(k.maks+k.min)/2;
  return {iv,pos:((n-1)/2-i)*jatah-tengah/arr[iv],jatah};
}
/* Selama kenopnya belum disentuh, kanal terus mengikuti sinyalnya. Ini yang
   memperbaiki gejala "semua kanal 0,5 mV/div": skala pertama dihitung saat
   jejaknya masih dua titik dan ayunannya nol, lalu dulu tidak pernah
   dihitung ulang. Ada histeresis supaya tidak berganti-ganti setiap bingkai. */
function selaraskanKanal(daftar){
  const n=daftar.length||1;
  daftar.forEach((k,i)=>{
    const id=idealKanal(k,i,n);
    let st=setelanKanal.get(k.id);
    if(!st){ setelanKanal.set(k.id,{iv:id.iv,pos:id.pos,auto:true,ac:false,sat:k.sat}); return }
    st.sat=k.sat;
    if(!st.auto) return;
    const arr=deret(st);
    const tinggi=(k.maks-k.min)/arr[st.iv];
    if(tinggi>id.jatah*0.92 || tinggi<id.jatah*0.22) st.iv=id.iv;
    const tengah=st.ac?0:(k.maks+k.min)/2;
    st.pos=((n-1)/2-i)*id.jatah-tengah/arr[st.iv];
  });
}
const WARNA_KANAL=[C.ok,C.silk,C.charge,'#8FB8D8'];

/* ---- kendali per kanal di bawah layar ---- */
const elCtl=document.getElementById('skopctl');
let sigCtl='';
elCtl.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const id=b.dataset.id, aksi=b.dataset.aksi;
  if(aksi==='auto'){ setelanKanal.clear(); sigCtl=''; return }
  if(aksi==='picu'){ picuAktif=!picuAktif; sigCtl=''; return }
  if(aksi==='tkurang'){ iJendela=Math.min(iJendela+1,JENDELA.length-1); sigCtl=''; return }
  if(aksi==='ttambah'){ iJendela=Math.max(iJendela-1,0); sigCtl=''; return }
  /* pkiri/pkanan dan naik/turun ditangani oleh tekan-tahan, bukan klik */
  if(aksi==='tutuptab'){ tabSkop=''; sigCtl=''; return }
  if(aksi==='pnol'){   posDivT=0; return }
  const st=setelanKanal.get(id); if(!st) return;
  const k=daftarTerakhir.find(x=>x.id===id);
  st.auto=false;                       /* kenop disentuh -> berhenti mengikuti */
  if(aksi==='ac') st.ac=!st.ac;
  if(aksi==='vplus'||aksi==='vminus'){
    /* PENTING: pos WAJIB dihitung ulang. Posisi di layar adalah v/vdiv+pos,
       jadi mengubah vdiv sementara pos dibiarkan akan melemparkan jejak jauh
       keluar layar — itu sebabnya sinyal hilang pada 20 mV/div ke bawah. */
    const arr=deret(st);
    const ofs=(st.ac&&k)?k.rata:0;
    const acuan=k?((k.maks+k.min)/2-ofs):0;
    const dLama=acuan/arr[st.iv]+st.pos;
    st.iv = aksi==='vplus' ? Math.min(st.iv+1,arr.length-1)
                           : Math.max(st.iv-1,0);
    st.pos=dLama-acuan/arr[st.iv];
    /* tahan di dalam kisi supaya tidak pernah lenyap */
    const set=NDIV_Y/2-0.3;
    if(dLama>set)  st.pos-=dLama-set;
    if(dLama<-set) st.pos+=-set-dLama;
  }
  sigCtl='';
});
let daftarTerakhir=[], picuAktif=true;
/* Tanda tangan HANYA memuat hal yang mengubah susunan (kanal, V/div, mode).
   Nilai bacaan sengaja tidak disertakan: kalau ikut, DOM dibangun ulang tiap
   bingkai dan tombolnya lenyap di antara tekan dan lepas — itu sebabnya
   tombol volt/div tidak bisa diklik. */
/* ===== tekan-tahan yang mempercepat sendiri ===============================
   Dengan langkah 0,01 divisi, memindahkan sinyal 4 divisi butuh 400 ketukan.
   Karena peluncur dihapus, tombol panah HARUS bisa ditahan: ketukan tunggal
   memberi langkah terhalus, tahanan melaju dan makin cepat.
   ========================================================================= */
function pasangTahan(el,fn){
  let jam=null, tunda=null, n=0;
  const berhenti=()=>{ clearTimeout(tunda); clearInterval(jam); jam=tunda=null; n=0 };
  el.addEventListener('pointerdown',e=>{
    e.preventDefault(); berhenti();
    fn(1);                                  /* ketukan tunggal = langkah terhalus */
    tunda=setTimeout(()=>{
      jam=setInterval(()=>{ n++; fn(n<12?1:(n<30?5:25)) },45);
    },330);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(nm=>
    el.addEventListener(nm,berhenti));
}

const MAKS_KANAL=2;      /* seperti osiloskop analog dua kanal */

let tabSkop='';          /* '' = tidak ada panel terbuka */

function bangunKendali(daftar){
  /* Tanda tangan memuat hal yang mengubah SUSUNAN saja — termasuk tab yang

    +'/'+(picuAktif?'P':'-')+'/'+iJendela+'/'+tabSkop;

  sigCtl=sig;

        '<button class="kecil" data-aksi="picu" title="Picu membuat sinyal berkala berdiri diam"'+
        (picuAktif?' aria-pressed="true"':'')+'>PICU '+(picuAktif?'ON':'OFF')+'</button>'+
        '<button class="kecil" data-aksi="tutuptab" title="Tutup panel setelan">⌄</button>'+
        '</div>';

  /* panel isi tab yang terbuka */
  const kanalTab=daftar.find(k=>k.id===tabSkop);
  if(kanalTab){
    const st=setelanKanal.get(kanalTab.id);
    html+='<div class="tabpanel"><div class="kan">'+
      '<span class="set"><span class="cap">'+(kanalTab.sat==='A'?'A/div':'V/div')+'</span>'+
        '<span class="grp">'+
          '<button data-id="'+kanalTab.id+'" data-aksi="vminus" title="Perkecil skala tegak">−</button>'+
          '<span class="val">'+fmtVdiv(deret(st)[st.iv],st.sat)+'</span>'+
          '<button data-id="'+kanalTab.id+'" data-aksi="vplus" title="Perbesar skala tegak">+</button>'+
        '</span></span>'+
      '<span class="set"><span class="cap">posisi</span>'+
        '<span class="grp">'+
          '<button data-id="'+kanalTab.id+'" data-aksi="turun" data-tahan="1" title="Turunkan — bisa ditahan">▼</button>'+
          '<button data-id="'+kanalTab.id+'" data-aksi="naik" data-tahan="1" title="Naikkan — bisa ditahan">▲</button>'+
        '</span></span>'+
      '<span class="set"><span class="cap">kopling</span>'+
        '<span class="grp"><button data-id="'+kanalTab.id+'" data-aksi="ac" '+
          'title="DC menampilkan tumpuan searahnya, AC membuangnya"'+
          (st.ac?' aria-pressed="true"':'')+'>'+(st.ac?'AC':'DC')+'</button></span></span>'+
      '</div></div>';
  } else if(tabSkop==='T'){
    html+='<div class="tabpanel"><div class="kan">'+
      '<span class="set"><span class="cap">time/div</span>'+
        '<span class="grp">'+
          '<button data-aksi="tkurang" title="Perlambat sapuan">◀</button>'+
          '<span class="val">'+(iJendela===0?'Semua':fmtWaktu(JENDELA[iJendela]/NDIV_X))+'</span>'+
          '<button data-aksi="ttambah" title="Percepat sapuan">▶</button>'+
        '</span></span>'+
      '<span class="set"><span class="cap">geser</span>'+
        '<span class="grp">'+
          '<button data-aksi="pkiri" data-tahan="1" title="Ke belakang — bisa ditahan">◀</button>'+
          '<span class="val" data-b="posT"></span>'+
          '<button data-aksi="pkanan" data-tahan="1" title="Ke depan — bisa ditahan">▶</button>'+

  elCtl.innerHTML=html;

  elCtl.querySelectorAll('button[data-tab]').forEach(b=>{

      sigCtl='';
    });
  });
  elCtl.querySelectorAll('button[data-tahan]').forEach(b=>{
    const id=b.dataset.id, aksi=b.dataset.aksi;
    pasangTahan(b,kali=>{
      const d=LANGKAH_HALUS*kali;
      if(aksi==='pkiri'){  posDivT=Math.min(posDivT+d,GESER_MAKS); return }
      if(aksi==='pkanan'){ posDivT=Math.max(posDivT-d,0); return }
      const st=setelanKanal.get(id); if(!st) return;
      st.auto=false;
      st.pos += (aksi==='naik' ? d : -d);
    });
  });
}

/* nilai geser diperbarui terpisah, karena letaknya di dalam kelompok tab T */
function segarkanBacaanTab(){
  const el=elCtl.querySelector('[data-b="posT"]');
  if(el){
    const t=posDivT?km(posDivT,2)+' d':'0';
    if(el.textContent!==t) el.textContent=t;
  }
}

function gambarScope(){
  const r=sc.getBoundingClientRect();
  const dpr=Math.min(devicePixelRatio||1,2.5);
  if(Math.abs(r.width-scL)>.5||Math.abs(r.height-scT)>.5){
    scL=r.width; scT=r.height;
    sc.width=Math.round(r.width*dpr); sc.height=Math.round(r.height*dpr);
  }
  sctx.setTransform(dpr,0,0,dpr,0,0);
  sctx.clearRect(0,0,scL,scT);
  sctx.textBaseline='middle';

  const mentah=[...jejak.entries()].filter(([,j])=>j.halus.t.length>1);
  if(!mentah.length){
    const adaProbe=M.komponen.some(k=>k.jenis==='probe'||
      ((k.jenis==='volt'||k.jenis==='ampere')&&k.prop.skop));
    sctx.fillStyle=C.muted; sctx.font=(12*FP())+'px system-ui, sans-serif'; sctx.textAlign='center';
    sctx.fillText(!adaProbe ? 'Pasang probe, atau nyalakan "Tampilkan di skop" pada alat ukur'
                : !hidup   ? 'Tekan Power untuk mulai merekam'
                :            'Merekam…', scL/2, scT/2);
    if(elCtl.innerHTML){elCtl.innerHTML='';sigCtl=''}
    return;
  }

  const tAkhir=Math.max(...mentah.map(([,j])=>j.halus.t[j.halus.t.length-1]));
  const lebar=JENDELA[iJendela]||Infinity;
  const geserT = (lebar===Infinity?0:posDivT*lebar/NDIV_X);
  let tMulai=Math.max(0,tAkhir-lebar-geserT), adaPicu=false;
  /* PICU (trigger): sapuan dimulai pada perlintasan naik yang sama setiap
     kali, sehingga sinyal berkala berdiri diam alih-alih menari-nari.
     Inilah jawaban osiloskop untuk gejala itu — bukan menghentikan gambar. */
  if(picuAktif && lebar!==Infinity){
    const sumber=(dipilih&&jejak.has(dipilih.id)&&jejak.get(dipilih.id).jenis==='probe')
                 ? dipilih.id : mentah[0][0];
    const jj=jejak.get(sumber);
    /* picu dicari pada penyangga halus bila ia mencakup jendelanya, karena
       ketepatan tepi menentukan kestabilan gambar */
    const j=jj && (jj.halus.t.length>6 && jj.halus.t[0]<=tMulai) ? jj.halus
          : (jj?jj.kasar:null);
    if(j && j.t.length>6){
      const tAmbil=tAkhir-Math.min(3*lebar, j.t[j.t.length-1]-j.t[0]);
      let lo=Infinity, hi=-Infinity;
      for(let i=0;i<j.t.length;i++) if(j.t[i]>=tAmbil){
        if(j.v[i]<lo) lo=j.v[i];
        if(j.v[i]>hi) hi=j.v[i];
      }
      if(hi-lo>1e-9){
        const aras=(lo+hi)/2, batas=tAkhir-0.9*lebar;
        for(let i=j.t.length-1;i>0;i--){
          if(j.t[i]>batas) continue;
          if(j.v[i-1]<aras && j.v[i]>=aras){
            tMulai=Math.max(0,j.t[i]-0.1*lebar-geserT); adaPicu=true; break;
          }
        }
      }
    }
  }
  const tSelesai = lebar===Infinity ? tAkhir : tMulai+lebar;
  const rentangT=Math.max(tSelesai-tMulai,1e-9);

  /* Dua kanal saja, seperti osiloskop analog dua kanal. Alat ukur yang
     sedang dipilih selalu ikut ditampilkan, sehingga mengetuk probe ketiga
     langsung menggantikan kanal kedua alih-alih tidak terlihat sama sekali. */
  let urut=mentah.slice();
  if(dipilih && jejak.has(dipilih.id)){
    const idx=urut.findIndex(([id])=>id===dipilih.id);
    if(idx>=MAKS_KANAL){ const ini=urut.splice(idx,1)[0]; urut.splice(1,0,ini) }
  }
  const lebihan=Math.max(0,urut.length-MAKS_KANAL);
  urut=urut.slice(0,MAKS_KANAL);
  const daftar=urut.map(([id,j],i)=>{
    /* pakai penyangga halus bila ia mencakup seluruh jendela; kalau tidak,
       pakai yang kasar beserta selubungnya */
    /* pakai halus bila ia mencakup jendelanya, ATAU bila ia tidak dimulai
       lebih lambat daripada kasar (mis. kanal baru: keduanya sama-sama muda,
       jadi yang halus lebih berguna) */
    const adaKasar=j.kasar.t.length>0;
    const halusCukup = j.halus.t.length>1 &&
      (j.halus.t[0]<=tMulai+1e-12 || !adaKasar ||
       j.halus.t[0]<=j.kasar.t[0]+1e-12);
    const sb = halusCukup ? j.halus : j.kasar;
    if(!sb.t.length) return null;
    const t=[],v=[],lo=[],hi=[];
    for(let q=0;q<sb.t.length;q++) if(sb.t[q]>=tMulai&&sb.t[q]<=tSelesai){
      t.push(sb.t[q]); v.push(sb.v[q]);
      lo.push(halusCukup?sb.v[q]:sb.lo[q]);
      hi.push(halusCukup?sb.v[q]:sb.hi[q]);
    }
    if(!t.length){
      const n=sb.t.length-1;
      t.push(sb.t[n]); v.push(sb.v[n]);
      lo.push(halusCukup?sb.v[n]:sb.lo[n]); hi.push(halusCukup?sb.v[n]:sb.hi[n]);
    }
    let jum=0; for(const q of v) jum+=q;
    return {id,t,v,lo,hi,halus:halusCukup,sat:j.sat||'V',jenis:j.jenis,nama:j.nama||id,
            warna:WARNA_KANAL[i%WARNA_KANAL.length],
            min:Math.min(...lo),maks:Math.max(...hi),kini:v[v.length-1],
            rata:jum/v.length};
  }).filter(Boolean);
  if(!daftar.length) return;
  selaraskanKanal(daftar);
  daftarTerakhir=daftar;

  /* Bacaan digambar di dalam layar, seperti osiloskop digital: panel di
     bawah layar jadi benar-benar hanya tab, dan angkanya tetap terlihat
     tanpa membuka tab apa pun. */
  const TINGGI_BACA=13*FP();
  const kiri=26, kanan=10, atas=8;
  const bawah=16+daftar.length*TINGGI_BACA;
  const yAtas=atas, yBawah=scT-bawah, yTengah=(yAtas+yBawah)/2;
  const divPx=(yBawah-yAtas)/NDIV_Y;
  const X=t=>kiri+((t-tMulai)/rentangT)*(scL-kiri-kanan);
  const Y=(v,st,ofs)=>yTengah-((v-(ofs||0))/deret(st)[st.iv]+st.pos)*divPx;

  /* kisi */
  sctx.strokeStyle='rgba(31,74,80,.9)'; sctx.lineWidth=1;
  for(let i=0;i<=NDIV_Y;i++){
    const y=Math.round(yAtas+i*divPx)+.5;
    sctx.beginPath();sctx.moveTo(kiri,y);sctx.lineTo(scL-kanan,y);sctx.stroke();
  }
  for(let i=0;i<=NDIV_X;i++){
    const x=Math.round(kiri+i*(scL-kiri-kanan)/NDIV_X)+.5;
    sctx.beginPath();sctx.moveTo(x,yAtas);sctx.lineTo(x,yBawah);sctx.stroke();
  }
  sctx.strokeStyle='rgba(127,160,163,.4)'; sctx.lineWidth=1.3;
  sctx.beginPath();sctx.moveTo(kiri,Math.round(yTengah)+.5);
  sctx.lineTo(scL-kanan,Math.round(yTengah)+.5);sctx.stroke();

  /* jejak, dipotong pada area kisi */
  sctx.save();
  sctx.beginPath();sctx.rect(kiri,yAtas,scL-kiri-kanan,yBawah-yAtas);sctx.clip();
  daftar.forEach(k=>{
    const st=setelanKanal.get(k.id);
    const disorot=!!dipilih&&dipilih.id===k.id;
    sctx.strokeStyle=k.warna; sctx.lineWidth=(disorot?2.4:1.5)*FP();
    sctx.globalAlpha=disorot?1:.85;
    const ofs=st.ac?k.rata:0;
    if(!k.halus){
      /* selubung terendah-tertinggi tiap selang: sinyal yang lebih cepat
         daripada laju cuplikan tampil sebagai pita, bukan sebagai cacah
         palsu yang menyesatkan */
      let tebal=0;
      for(let i=0;i<k.t.length;i++) tebal=Math.max(tebal,k.hi[i]-k.lo[i]);
      if(tebal/deret(st)[st.iv]*divPx>2){
        sctx.globalAlpha=disorot?.45:.32; sctx.fillStyle=k.warna;
        sctx.beginPath();
        for(let i=0;i<k.t.length;i++) sctx.lineTo(X(k.t[i]),Y(k.hi[i],st,ofs));
        for(let i=k.t.length-1;i>=0;i--) sctx.lineTo(X(k.t[i]),Y(k.lo[i],st,ofs));
        sctx.closePath(); sctx.fill();
        sctx.globalAlpha=disorot?1:.85;
      }
    }
    sctx.beginPath();
    for(let i=0;i<k.t.length;i++){
      const x=X(k.t[i]), y=Y(k.v[i],st,ofs);
      i?sctx.lineTo(x,y):sctx.moveTo(x,y);
    }
    sctx.stroke(); sctx.globalAlpha=1;
  });
  sctx.restore();

  /* penanda titik nol tiap kanal di tepi kiri */
  daftar.forEach(k=>{
    const st=setelanKanal.get(k.id);
    const y=Y(st.ac?k.rata:0,st,st.ac?k.rata:0);
    if(y<yAtas-2||y>yBawah+2) return;
    sctx.fillStyle=k.warna;
    sctx.beginPath();
    sctx.moveTo(kiri-2,y); sctx.lineTo(kiri-11,y-5); sctx.lineTo(kiri-11,y+5);
    sctx.closePath(); sctx.fill();
  });

  /* sumbu waktu */
  sctx.fillStyle=C.muted; sctx.font=(9.5*FP())+'px ui-monospace, monospace';
  sctx.textAlign='left';  sctx.fillText(fmtWaktu(tMulai),kiri,yBawah+8);
  sctx.textAlign='right'; sctx.fillText(fmtWaktu(tSelesai),scL-kanan,yBawah+8);
  sctx.textAlign='center';
  sctx.fillText(fmtWaktu(rentangT/NDIV_X)+'/div'+
                (adaPicu?'  · terpicu':(picuAktif&&lebar!==Infinity?'  · menunggu picu':''))+
                (jeda?'  · JEDA':(hidup?'':'  · berhenti')),(kiri+scL-kanan)/2,yBawah+8);
  /* tanda titik picu di 10% dari tepi kiri */
  if(adaPicu){
    const xp=kiri+0.1*(scL-kiri-kanan);
    sctx.strokeStyle='rgba(134,182,222,.55)'; sctx.lineWidth=1;
    sctx.beginPath();sctx.moveTo(xp+.5,yAtas);sctx.lineTo(xp+.5,yBawah);sctx.stroke();
    sctx.fillStyle=C.pilih;
    sctx.beginPath();sctx.moveTo(xp,yAtas);sctx.lineTo(xp-4,yAtas-5);
    sctx.lineTo(xp+4,yAtas-5);sctx.closePath();sctx.fill();
  }

  if(lebihan){
    sctx.fillStyle=C.muted; sctx.font=(9.5*FP())+'px ui-monospace, monospace';
    sctx.textAlign='right'; sctx.textBaseline='top';
    sctx.fillText('+'+lebihan+' alat lain — ketuk alatnya untuk menampilkan',
      scL-kanan,yAtas+2);
    sctx.textBaseline='middle';
  }
  /* baris bacaan tiap kanal, di bawah sumbu waktu, dengan warna kanalnya */
  sctx.font=(10*FP())+'px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  sctx.textBaseline='middle'; sctx.textAlign='left';
  daftar.forEach((k,i)=>{
    const y=yBawah+16+TINGGI_BACA*i+TINGGI_BACA/2-2;
    const T=ukurPerioda(k), tau=ukurTau(k);
    sctx.fillStyle=k.warna;
    sctx.fillText(k.nama,kiri,y);
    sctx.fillStyle=C.silk;
    const satPP=(k.sat==='A'?'Ip-p':'Vp-p');
    let x=kiri+26*FP();
    const tulis=(nm,nilai)=>{
      sctx.fillStyle=C.muted; sctx.fillText(nm,x,y);
      x+=sctx.measureText(nm).width+5*FP();
      sctx.fillStyle=C.silk; sctx.fillText(nilai,x,y);
      x+=Math.max(sctx.measureText(nilai).width,44*FP())+11*FP();
    };
    tulis(satPP,fmtNilai(k.maks-k.min,k.sat));
    tulis('T',T?fmtWaktu(T):'—');
    tulis('f',T?fmtHz(1/T):'—');
    if(scL>520){
      tulis('kini',fmtNilai(k.kini,k.sat));
      if(tau) tulis('τ',fmtWaktu(tau));
    }
  });
  bangunKendali(daftar);
  segarkanBacaanTab();
}

/* tau hanya dilaporkan bila jejaknya memang satu transisi utuh: mulai dekat
   nol lalu naik, atau mulai tinggi lalu turun ke nol. */
/* Perioda diukur dari jarak antar perlintasan naik pada aras tengah sinyal.
   Untuk DC tidak ada perlintasan, jadi hasilnya 0 dan dilaporkan sebagai DC. */
function ukurPerioda(k){
  const v=k.v,t=k.t,n=v.length;
  if(n<10) return 0;
  const ayun=k.maks-k.min;
  if(ayun<1e-9) return 0;
  const aras=(k.min+k.maks)/2, batas=ayun*0.05;
  const naik=[];
  let siap=true;
  for(let i=1;i<n;i++){
    if(siap && v[i-1]<aras && v[i]>=aras){
      const r=(aras-v[i-1])/((v[i]-v[i-1])||1);
      naik.push(t[i-1]+(t[i]-t[i-1])*r);
      siap=false;
    }
    if(!siap && v[i]<aras-batas) siap=true;   /* histeresis, tolak derau */
  }
  if(naik.length<2) return 0;
  const T=(naik[naik.length-1]-naik[0])/(naik.length-1);
  return T>1e-9?T:0;
}

/* tau diukur dari selisih waktu perlintasan 10% dan 90% pada lonjakan
   terakhir. Untuk tanggapan RC, t90 - t10 = tau * ln 9 — selalu, dan tidak
   bergantung pada "kapan lonjakan itu mulai". Cara sebelumnya mengukur dari
   awal lonjakan, dan itu rapuh: dataran datar sebelum lonjakan juga menjauh
   dari nilai akhir, sehingga penelusuran mundur merambat sampai ke fase
   sebelumnya dan tau terbaca 50 ms padahal RC-nya 10 ms. */
const LN9=Math.log(9);
function ukurTau(k){
  const v=k.v, t=k.t, n=v.length;
  if(n<12) return 0;
  const ayun=k.maks-k.min;
  if(ayun<1e-9) return 0;
  const vAkhir=v[n-1];
  /* arah lonjakan terakhir, diambil dari beberapa cuplikan agar tidak
     terkecoh satu titik */
  const arah=Math.sign(vAkhir-v[Math.max(0,n-6)]);
  if(!arah) return 0;
  /* jalan mundur selama masih searah, untuk mendapat NILAI dasar lonjakan */
  const tolL=ayun*0.01;
  let i0=n-1;
  for(let i=n-2;i>=0;i--){
    if((v[i+1]-v[i])*arah >= -tolL) i0=i; else break;
  }
  const vMulai=v[i0], amp=vAkhir-vMulai;
  if(Math.abs(amp)<0.4*ayun) return 0;
  if(Math.abs(v[n-1]-v[n-4])>0.02*Math.abs(amp)) return 0;   /* harus sudah mendatar */
  /* perlintasan 10% dan 90%, dengan penyisipan lurus antar cuplikan */
  const lintas=frac=>{
    const sasaran=vMulai+frac*amp;
    for(let i=i0+1;i<n;i++){
      const a1=v[i-1], b1=v[i];
      if((arah>0 && b1>=sasaran) || (arah<0 && b1<=sasaran)){
        const d=b1-a1;
        const r=Math.abs(d)>1e-15 ? (sasaran-a1)/d : 0;
        return t[i-1]+(t[i]-t[i-1])*Math.min(Math.max(r,0),1);
      }
    }
    return null;
  };
  const t10=lintas(0.1), t90=lintas(0.9);
  if(t10===null||t90===null||t90<=t10) return 0;
  return (t90-t10)/LN9;
}

const jari=new Map();
let aksi=null, tekanUji=null, awal=null;
let sudahGerak=false, sudahRekam=false, pinch=null;
const posKanvas=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};

cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  const [sx,sy]=posKanvas(e);
  jari.set(e.pointerId,{x:sx,y:sy});
  if(jari.size===2){
    const [a,b]=[...jari.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y),zoom,mid:[(a.x+b.x)/2,(a.y+b.y)/2],pan:{...pan}};
    aksi=null; tekanUji=null; return;
  }
  awal={x:sx,y:sy}; sudahGerak=false; sudahRekam=false;
  const [wx,wy]=keDunia(sx,sy);
  tekanUji=ujiTitik(wx,wy);

  if(tekanUji.t==='badan')
    aksi={t:'geserKomp',k:tekanUji.k,dx:wx-tekanUji.k.x,dy:wy-tekanUji.k.y};
  else if(tekanUji.t==='pegangan'){
    const k=komponenOleh(tekanUji.kunci.split(':')[0]);
    aksi={t:'geserKomp',k,dx:wx-k.x,dy:wy-k.y};
  }
  else if(tekanUji.t==='tuas')
    aksi={t:'geserKomp',k:tekanUji.k,dx:wx-tekanUji.k.x,dy:wy-tekanUji.k.y};
  else if(tekanUji.t==='kawat')
    aksi={t:'geserKawat',i:tekanUji.i,tegak:tekanUji.tegak};
  else
    aksi={t:'geserPan',x:sx,y:sy,pan:{...pan}};
});

cv.addEventListener('pointermove',e=>{
  const [sx,sy]=posKanvas(e);
  if(!jari.has(e.pointerId)){
    const [wx,wy]=keDunia(sx,sy);
    const u=ujiTitik(wx,wy);
    sorot=(u.t==='kosong')?null:u;
    cv.style.cursor = u.t==='pegangan'?'crosshair'
                    : u.t==='tuas'?'pointer'
                    : u.t==='badan'?'move'
                    : u.t==='kawat'?(pinTertunda?'crosshair':(u.tegak?'ew-resize':'ns-resize'))
                    : 'grab';
    return;
  }
  jari.set(e.pointerId,{x:sx,y:sy});
  if(awal&&Math.hypot(sx-awal.x,sy-awal.y)>AMBANG_GERAK) sudahGerak=true;

  if(jari.size===2&&pinch){
    const [a,b]=[...jari.values()], d=Math.hypot(a.x-b.x,a.y-b.y);
    const z=Math.min(Math.max(pinch.zoom*d/(pinch.d||1),.45),2.8);
    const [mx,my]=pinch.mid;
    pan.x=pinch.pan.x+mx/pinch.zoom-mx/z;
    pan.y=pinch.pan.y+my/pinch.zoom-my/z;
    zoom=z; return;
  }
  if(!sudahGerak||!aksi) return;
  const [wx,wy]=keDunia(sx,sy);

  if(aksi.t==='geserKomp'){
    if(!sudahRekam){rekam();sudahRekam=true}
    aksi.k.x=bulat(wx-aksi.dx); aksi.k.y=bulat(wy-aksi.dy);
    if(dipilih!==aksi.k) pilihKomp(aksi.k);
    segarkan(); return;
  }
  if(aksi.t==='geserKawat'){
    const w=M.kawat[aksi.i]; if(!w) return;
    if(!sudahRekam){rekam();sudahRekam=true}
    if(aksi.tegak){ w.orient='v'; w.m=bulat(wx) }
    else          { w.orient='h'; w.m=bulat(wy) }
    if(pilihKawat!==aksi.i) pilihWire(aksi.i);
    return;                       /* topologi tidak berubah, tak perlu hitung ulang */
  }
  pan.x=aksi.pan.x-(sx-aksi.x)/zoom;
  pan.y=aksi.pan.y-(sy-aksi.y)/zoom;
});

let ketukLalu={t:0,x:0,y:0,id:''};
function lepas(e){
  const ada=jari.delete(e.pointerId);
  if(jari.size<2) pinch=null;
  if(ada&&!sudahGerak&&tekanUji&&awal){
    /* deteksi ketukan ganda dipakai satu aturan untuk sentuh maupun mouse */
    const kini=(performance&&performance.now)?performance.now():Date.now();
    const sasaran = tekanUji.t==='badan' ? tekanUji.k.id
                  : tekanUji.t==='kawat' ? 'w'+tekanUji.i : '';
    const ganda = !!sasaran && sasaran===ketukLalu.id && kini-ketukLalu.t<380 &&
                  Math.hypot(awal.x-ketukLalu.x,awal.y-ketukLalu.y)<24;
    ketukLalu={t:kini,x:awal.x,y:awal.y,id:sasaran};

    if(tekanUji.t==='pegangan'){
      const kunci=tekanUji.kunci;
      if(pinTertunda&&pinTertunda!==kunci){
        if(pinTertunda.split(':')[0]!==kunci.split(':')[0]){
          if(sambung(pinTertunda,kunci)) rekam();
          pinTertunda=null;
        }
      }else pinTertunda = pinTertunda===kunci ? null : kunci;
      segarkan(); gambarIns();
    }
    else if(tekanUji.t==='tuas'){
      rekam();
      const kk=tekanUji.k;
      if(tekanUji.aksi==='toggle') kk.prop.tutup=kk.prop.tutup?0:1;
      if(tekanUji.aksi==='tambah') kk.prop.pos=Math.min((kk.prop.pos||0)+.05,1);
      if(tekanUji.aksi==='kurang') kk.prop.pos=Math.max((kk.prop.pos||0)-.05,0);
      segarkan(); gambarIns();
    }
    else if(tekanUji.t==='badan'){
      pinTertunda=null; pilihKomp(tekanUji.k);
      if(ganda) bukaSheet(true);
      else{
        bukaSheet(false);
        /* sekali ketuk pada alat ukur: layar osiloskop saja, tanpa detail.
           Komponennya tetap terpilih sehingga bisa langsung digeser. */
        const kk=tekanUji.k;
        if(kk.jenis==='probe' ||
           ((kk.jenis==='volt'||kk.jenis==='ampere')&&kk.prop.skop)) bukaScope(true);
      }
      segarkan();
    }
    else if(tekanUji.t==='kawat'){
      if(pinTertunda){
        /* menyambung ke tengah kawat -> lahir titik cabang */
        const [wx,wy]=keDunia(awal.x,awal.y);
        rekam();
        const j=belahKawat(tekanUji.i,tekanUji.seg,wx,wy);
        if(j) sambung(pinTertunda,j.id+':0');
        pinTertunda=null; pilihKawat=-1; pilihKomp(null);
      }else{
        pinTertunda=null; pilihWire(tekanUji.i); bukaSheet(ganda);
      }
      segarkan();
    }
    else { pinTertunda=null; pilihKomp(null); pilihWire(-1); bukaSheet(false); segarkan() }
  }
  aksi=null; tekanUji=null; awal=null;
}
cv.addEventListener('pointerup',lepas);
cv.addEventListener('pointercancel',lepas);
cv.addEventListener('pointerleave',()=>{sorot=null});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const [sx,sy]=posKanvas(e);
  const z=Math.min(Math.max(zoom*(e.deltaY<0?1.1:1/1.1),.45),2.8);
  pan.x+=sx/zoom-sx/z; pan.y+=sy/zoom-sy/z; zoom=z;
},{passive:false});
addEventListener('keydown',e=>{
  /* Jangan sentuh papan ketik bila fokus sedang berada di kotak isian.
     Tanpa penjaga ini, Backspace saat mengetik nilai komponen justru
     menghapus komponennya. */
  const f=e.target;
  if(f&&(f.tagName==='INPUT'||f.tagName==='SELECT'||f.tagName==='TEXTAREA'||f.isContentEditable)) return;
  if(e.key==='Escape'){
    if(skopbar.classList.contains('buka')) bukaScope(false);
    pinTertunda=null;pilihKomp(null);pilihWire(-1);bukaSheet(false);kabar();segarkan();
  }
  if((e.key==='Delete'||e.key==='Backspace')){
    if(dipilih){rekam();hapusKomponen(dipilih.id);pilihKomp(null);segarkan()}
    else if(pilihKawat>=0){rekam();M.kawat.splice(pilihKawat,1);pilihWire(-1);segarkan()}
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();bUndo.click()}
});

const mUndo2=document.getElementById('mUndo2'), mRedo2=document.getElementById('mRedo2');

const kisi7=document.getElementById('kisi7');
/* Palet disusun ulang setiap kali dibuka, karena ikonnya digambar ke kanvas
   dan perlu memakai devicePixelRatio serta mode proyektor yang berlaku saat itu. */
function pasangPalet(){
  kisi7.innerHTML='';
  for(const g of KELOMPOK){
    const jd=document.createElement('p');
    jd.className='lbl'; jd.style.cssText='grid-column:1/-1;margin:9px 0 1px';
    jd.innerHTML=g.nama;
    kisi7.appendChild(jd);
    for(const j of g.isi){
      const b=document.createElement('button');
      b.className='pk';
      const kanvas=document.createElement('canvas');
      kanvas.style.cssText='width:46px;height:34px;flex:none';
      const sp=document.createElement('span'); sp.textContent=JENIS[j].nama;
      b.append(kanvas,sp);
      b.addEventListener('click',()=>{
        rekam();
        const [wx,wy]=keDunia(lebarCSS/2,tinggiCSS*0.42);
        cascade=(cascade+1)%4;
        const k=tambahKomponen(j,wx+cascade*KISI,wy+cascade*KISI);
        bukaPalet(false); pinTertunda=null; pilihKomp(k); segarkan();
      });
      kisi7.appendChild(b);
      gambarIkon(j,kanvas,46,34);
    }
  }
}
function pas(){
  if(!M.komponen.length){pan={x:-30,y:-30};zoom=1;return}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const k of M.komponen){
    x0=Math.min(x0,k.x-80);y0=Math.min(y0,k.y-80);
    x1=Math.max(x1,k.x+80);y1=Math.max(y1,k.y+80);
  }
  zoom=Math.min(Math.max(Math.min(lebarCSS/(x1-x0),tinggiCSS/(y1-y0)),.7),1.5);
  pan.x=x0-(lebarCSS/zoom-(x1-x0))/2;
  pan.y=y0-(tinggiCSS/zoom-(y1-y0))/2;
}

fBuka.addEventListener('change',()=>{
  const f=fBuka.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const mentah=JSON.parse(fr.result);
      if(!mentah.k) throw 0;
      if(mentah.aplikasi && mentah.aplikasi!==APLIKASI)
        throw new Error('Berkas ini bukan rangkaian '+APLIKASI);
      const d=migrasi(mentah);
      if(!d) throw new Error('Berkas dibuat oleh versi SASMITA yang lebih baru — '+
        'mutakhirkan aplikasinya dulu');
      rekam(); pakai(d); pas(); segarkan();
    }catch(e){ elPeringatan.textContent=(e&&e.message)?e.message:'Berkas tidak bisa dibaca' }
    fBuka.value='';
  };
  fr.readAsText(f);
});

  pinTertunda=null; pilihKomp(null); pas(); segarkan();
}

/* ==========================================================================
   11. PUTARAN UTAMA
   ========================================================================== */
/* satu pintu ke mesin: majukan waktu sebanyak dtSim, lalu turunkan arus
   tiap kawat. dtSim = 0 berarti "hitung ulang tanpa memajukan waktu". */
/* Laju cuplikan mengikuti basis waktu layar, bukan laju bingkai. Jendela
   1 ms pada 1600 cuplikan berarti 0,625 us per cuplikan — cukup untuk 20 kHz
   dengan puluhan titik per gelombang. Dibatasi tidak lebih halus daripada
   langkah solver, karena di bawah itu tidak ada informasi baru. */
function dtCuplikSekarang(){
  const lebar=JENDELA[iJendela];
  if(!lebar) return 0;            /* mode "Semua": satu cuplikan per bingkai */
  return lebar/CUPLIK_PER_JENDELA;
}
const alatSkop=()=>M.komponen.filter(k=>k.jenis==='probe' ||
  ((k.jenis==='volt'||k.jenis==='ampere') && k.prop.skop))
  .map(k=>({id:k.id,jenis:k.jenis}));
function hitung(dtSim){
  if(!hidup) return {ok:false,alasan:'mati',V:[0],net:bikinNet(M),
                     arusKomp:new Map(),arusKawat:new Map()};
  const r=majuWaktu(M,dtSim,alatSkop(),dtCuplikSekarang());
  r.arusKawat = r.ok ? arusPerKawat(M,r.net,r.arusKomp) : new Map();
  if(r.ok) for(const k of M.komponen) if(k.jenis==='kapasitor'){
    const v=Math.abs(keadaan.get(k.id)||0);
    if(v>(vMaks.get(k.id)||0)) vMaks.set(k.id,v);
  }
  return r;
}
function segarkan(){ hasil=hitung(0); gambarUkur(); kabar(); setRiwayat() }
function resetWaktu(){
  resetKeadaan(); vMaks.clear(); jejak.clear(); setelanKanal.clear(); sigCtl='';
  nolkanRekam(); segarkan();
}
const kurangiGerak=matchMedia('(prefers-reduced-motion: reduce)').matches;
function nilaiAlat(k){
  if(!hasil||!hasil.ok) return 0;
  const sim=x=>hasil.net.petaSimpul.get(x);
  if(k.jenis==='probe') return hasil.V[sim(k.id+':0')]||0;
  if(k.jenis==='volt') return (hasil.V[sim(k.id+':0')]||0)-(hasil.V[sim(k.id+':1')]||0);
  return hasil.arusKomp.get(k.id)||0;
}
/* ===== dua penyangga rekaman ==============================================
   HALUS : cuplikan setiap bingkai, antre maju-mundur (yang tertua dibuang).
           Jaraknya rapat dan seragam -> dipakai untuk jendela pendek, dan
           inilah yang mencegah sinyal 1 kHz berubah menjadi cacah kacau.
   KASAR : cuplikan pada interval seragam yang digandakan bila penuh, plus
           nilai terendah & tertinggi pada tiap selang (peak detect) ->
           dipakai untuk rentang panjang, bentuknya tidak menipu.
   Versi sebelumnya hanya punya satu penyangga: kalau rapat, riwayat lama
   rusak; kalau seragam-renggang, sinyal cepat rusak. Keduanya perlu ada.
   ========================================================================= */
const HALUS_MAKS=12000, KASAR_MAKS=1600, HALUS_BUANG=1500;
let intervalKasar=0, tKasarAkhir=-Infinity;
const akumKasar=new Map();
function nolkanRekam(){ intervalKasar=0; tKasarAkhir=-Infinity; akumKasar.clear() }

function rekamJejak(){
  if(!hasil||!hasil.ok) return;
  /* probe selalu direkam; voltmeter dan amperemeter hanya bila tombol
     "Tampilkan di skop" pada panelnya diaktifkan */
  const alat=M.komponen.filter(k=>k.jenis==='probe' ||
    ((k.jenis==='volt'||k.jenis==='ampere') && k.prop.skop));
  for(const id of [...jejak.keys()]) if(!alat.some(k=>k.id===id)) jejak.delete(id);
  if(!alat.length) return;

  /* Cuplikan datang sebagai DERET dari dalam putaran substep, bukan satu
     nilai per bingkai. Inilah yang membuat 20 kHz tergambar mulus. */
  const tC=hasil.tCup||[], daftarC=hasil.cuplik||[];
  const petaC=new Map(daftarC.map(c=>[c.id,c.v]));

  for(const k of alat){
    let j=jejak.get(k.id);
    const baru=!j;
    if(baru){ j={jenis:k.jenis,sat:k.jenis==='ampere'?'A':'V',
                 halus:{t:[],v:[]},kasar:{t:[],v:[],lo:[],hi:[]}};
              jejak.set(k.id,j) }
    j.nama=namaAlat(k);
    const seri=petaC.get(k.id);
    const nilaiAkhir = (seri&&seri.length) ? seri[seri.length-1] : nilaiAlat(k);
    /* Kanal yang baru dinyalakan di tengah rekaman langsung diberi satu
       cuplikan kasar, agar penyangga kasarnya tidak pernah kosong. */
    if(baru){ j.kasar.t.push(tSim); j.kasar.v.push(nilaiAkhir);
              j.kasar.lo.push(nilaiAkhir); j.kasar.hi.push(nilaiAkhir) }

    let ak=akumKasar.get(k.id);
    if(!ak){ ak={lo:nilaiAkhir,hi:nilaiAkhir}; akumKasar.set(k.id,ak) }

    if(seri && seri.length===tC.length && seri.length){
      for(let i=0;i<seri.length;i++){
        j.halus.t.push(tC[i]); j.halus.v.push(seri[i]);
        if(seri[i]<ak.lo) ak.lo=seri[i];
        if(seri[i]>ak.hi) ak.hi=seri[i];
      }
    }else{
      j.halus.t.push(tSim); j.halus.v.push(nilaiAkhir);
      if(nilaiAkhir<ak.lo) ak.lo=nilaiAkhir;
      if(nilaiAkhir>ak.hi) ak.hi=nilaiAkhir;
    }
    if(j.halus.t.length>HALUS_MAKS+HALUS_BUANG){
      const buang=j.halus.t.length-HALUS_MAKS;
      j.halus.t.splice(0,buang); j.halus.v.splice(0,buang);
    }
  }

  if(tSim-tKasarAkhir < intervalKasar) return;
  tKasarAkhir=tSim;
  for(const k of alat){
    const j=jejak.get(k.id), ak=akumKasar.get(k.id);
    const nilai=j.halus.v[j.halus.v.length-1];
    j.kasar.t.push(tSim); j.kasar.v.push(nilai);
    j.kasar.lo.push(ak?ak.lo:nilai); j.kasar.hi.push(ak?ak.hi:nilai);
    akumKasar.set(k.id,{lo:nilai,hi:nilai});
  }
  const contoh=jejak.get(alat[0].id);
  if(contoh && contoh.kasar.t.length>KASAR_MAKS){
    for(const j of jejak.values()){
      const K=j.kasar, t=[],v=[],lo=[],hi=[];
      for(let i=0;i<K.t.length;i+=2){
        t.push(K.t[i]); v.push(K.v[i]);
        lo.push(i+1<K.t.length?Math.min(K.lo[i],K.lo[i+1]):K.lo[i]);
        hi.push(i+1<K.t.length?Math.max(K.hi[i],K.hi[i+1]):K.hi[i]);
      }
      j.kasar={t,v,lo,hi};
    }
    const n=contoh.kasar.t.length;
    if(n>1) intervalKasar=(contoh.kasar.t[n-1]-contoh.kasar.t[0])/(n-1);
  }
}

function bingkai(t){
  const dt=lalu?Math.min((t-lalu)/1000,.05):0; lalu=t;
  if(hidup&&!jeda&&dt>0){
    hasil=hitung(dt*SKALA[iSkala]);
    rekamJejak();
    gambarUkur();
  }
  if(!kurangiGerak&&hidup&&!jeda&&hasil&&hasil.ok){
    const laju=i=>Math.min(Math.abs(i)*K_LAJU,LAJU_MAKS);
    M.kawat.forEach((w,i)=>{
      const kk='w'+i;
      geser.set(kk,(geser.get(kk)||0)+laju(hasil.arusKawat.get(i)||0)*dt);
    });
    for(const k of M.komponen){
      if(k.pin.length<2) continue;
      geser.set(k.id,(geser.get(k.id)||0)+laju(hasil.arusKomp.get(k.id)||0)*dt);
    }
  }
  gambar(); gambarScope(); requestAnimationFrame(bingkai);
}

/* ==========================================================================
   12. PEMASANGAN & PEMBARUAN (PWA)
   Service worker hanya berjalan di http/https — TIDAK dari file://. Karena
   itu pendaftarannya dijaga: berkas tunggal yang dibuka langsung dari folder
   tetap berfungsi penuh, hanya tidak bisa dipasang sebagai aplikasi.
   ========================================================================== */
const pitaBaru=document.getElementById('pitaBaru');
document.getElementById('bTundaBaru').addEventListener('click',()=>
  pitaBaru.classList.remove('tampil'));

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      const pantau=sw=>{
        if(!sw) return;
        sw.addEventListener('statechange',()=>{
          /* 'installed' + sudah ada controller = ini pembaruan, bukan pasang pertama */
          if(sw.state==='installed' && navigator.serviceWorker.controller){
            document.getElementById('bMuatUlang').onclick=()=>{
              sw.postMessage({aksi:'lewatiTunggu'});
            };
            /* Tanyakan nomor versinya kepada service worker yang baru, supaya
               pemberitahuannya menyebut versi apa yang akan dipasang. */
            try{
              const ch=new MessageChannel();
              ch.port1.onmessage=ev=>{
                const el=document.getElementById('versiBaru');
                if(el && ev.data) el.textContent=' — '+ev.data;
              };
              sw.postMessage({aksi:'versi'},[ch.port2]);
            }catch(_){}
            pitaBaru.classList.add('tampil');
          }
        });
      };
      pantau(reg.installing);
      reg.addEventListener('updatefound',()=>pantau(reg.installing));
      /* periksa pembaruan tiap kali aplikasi dibuka kembali */
      document.addEventListener('visibilitychange',()=>{
        if(!document.hidden) reg.update().catch(()=>{});
      });
    }).catch(()=>{});
    let sudahMuatUlang=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(sudahMuatUlang) return;
      sudahMuatUlang=true; location.reload();
    });
  });
}

/* tombol pasang: hanya muncul bila peramban menawarkannya */

addEventListener('beforeinstallprompt',e=>{

    setTimeout(()=>{elPeringatan.textContent='';elPeringatan.style.color=''},7000);

}

addEventListener('resize',()=>ukur());
addEventListener('orientationchange',()=>setTimeout(ukur,120));
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) ukur() });
if(window.visualViewport) visualViewport.addEventListener('resize',()=>ukur());
/* Tata letak bisa berubah tanpa memicu event resize — misalnya saat panel
   bawah mengembang. Tanpa ini, bitmap kanvas diperas CSS dan gambar bergeser
   dari posisi uji sentuhnya. */

else setInterval(()=>{

  if(Math.abs(r.width-lebarCSS)>.5||Math.abs(r.height-tinggiCSS)>.5) ukur();
},300);

segarkanMenu();
ukur(); setModeTampil(1); gambarIns(); muatContoh(); tumpukan.length=0; setRiwayat();
