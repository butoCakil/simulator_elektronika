<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SASMITA — Simulator Skema Interaktif Elektronika</title>
<meta name="description" content="SASMITA — simulator skema elektronika interaktif: rangkaian DC, transien, dioda, penyearah, transistor, op-amp, dengan osiloskop. Bekerja tanpa internet.">
<meta name="theme-color" content="#14343A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="ikon/favicon-64.png">
<link rel="apple-touch-icon" href="ikon/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SASMITA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --panel:#14343A; --panel-dark:#0E2529; --panel-up:#1A4048;
    --rule:#1F4A50; --silk:#E8E2D0; --muted:#7FA0A3;
    --copper:#B87333; --charge:#E9B949; --hot:#C4453B; --ok:#63A48C;
    --pilih:#86B6DE;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--panel-dark);color:var(--silk);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.5;display:flex;flex-direction:column;overscroll-behavior:none}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 8px;
    background:var(--panel);border-bottom:1px solid var(--rule);flex:none;position:relative}
  button{font:inherit;font-size:11px;text-transform:uppercase;letter-spacing:.09em;
    background:transparent;color:var(--silk);border:1px solid var(--rule);border-radius:2px;
    padding:0 12px;height:40px;cursor:pointer;white-space:nowrap;flex:none;
    display:inline-flex;align-items:center;justify-content:center;gap:6px}
  button:disabled{opacity:.35;cursor:default}
  button[aria-pressed=true]{border-color:var(--pilih);color:var(--pilih);background:rgba(134,182,222,.09)}
  button:focus-visible{outline:2px solid var(--pilih);outline-offset:2px}
  .pw[aria-pressed=true]{border-color:var(--ok);color:var(--ok);background:rgba(99,164,140,.1)}
  .tambah{border-color:var(--pilih);color:var(--pilih)}
  .ikon{width:42px;padding:0;font-size:17px;letter-spacing:0;text-transform:none}
  .tumbuh{flex:1 1 auto}
  /* Lebar dan tinggi menu dibatasi tegas, dan isinya menggulir sendiri.
     Sebelumnya menu tumbuh mengikuti isi, sehingga membuka submenu contoh
     langsung menutupi hampir seluruh jendela. */
  .menu{position:absolute;top:calc(100% + 2px);right:8px;left:auto;z-index:20;
    background:var(--panel-up);border:1px solid var(--rule);border-radius:3px;padding:6px;
    width:max-content;min-width:210px;max-width:min(320px,calc(100vw - 16px));
    max-height:min(66vh,460px);overflow-y:auto;overscroll-behavior:contain;display:none;
    box-shadow:0 14px 34px rgba(0,0,0,.5)}
  .menu.buka{display:block}
  .menu button{width:100%;justify-content:flex-start;border:none;height:42px;padding:0 10px}
  .menu hr{border:none;border-top:1px solid var(--rule);margin:5px 2px}

  #bidang{flex:1 1 auto;position:relative;min-height:0}
  /* khusus kanvas skema. JANGAN memakai selektor `canvas`, karena kanvas
     osiloskop juga akan ikut dilepas dari aliran tata letak. */
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .chip{position:absolute;left:50%;transform:translateX(-50%);top:10px;
    background:rgba(14,37,41,.95);border:1px solid var(--pilih);border-radius:20px;
    padding:8px 8px 8px 15px;display:none;align-items:center;gap:9px;font-size:12.5px;
    color:var(--pilih);max-width:calc(100% - 20px);z-index:10}
  .chip.tampil{display:flex}
  .chip button{height:32px;padding:0 11px;font-size:10.5px;border-color:var(--pilih);color:var(--pilih)}
  .peringatan{position:absolute;left:12px;right:12px;bottom:10px;text-align:center;
    font-size:12.5px;color:var(--hot);pointer-events:none}
  .pita{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;z-index:11;
    background:rgba(14,37,41,.96);border:1px solid var(--ok);border-radius:20px;
    padding:8px 8px 8px 15px;display:none;align-items:center;gap:8px;
    font-size:12.5px;color:var(--ok);max-width:calc(100% - 20px)}
  .pita.tampil{display:flex}
  .pita button{height:32px;padding:0 11px;font-size:10.5px;
    border-color:var(--ok);color:var(--ok)}

  .sheet{flex:none;background:var(--panel);border-top:1px solid var(--rule);
    display:flex;flex-direction:column;max-height:52vh}
  /* Di layar lebar, panel detail menjadi kartu kecil di sudut, bukan pita
     selebar layar. Kanvas pun mendapat seluruh tinggi yang tersisa. */
  @media(min-width:760px){
    .sheet{position:fixed;right:14px;bottom:14px;width:360px;z-index:12;
      max-height:min(64vh,540px);border:1px solid var(--rule);border-radius:5px;
      box-shadow:0 18px 44px rgba(0,0,0,.5)}
  }
  .pegang{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;flex:none}
  .pegang .garis{width:34px;height:3px;border-radius:2px;background:var(--rule);flex:none}
  .pegang .ket{font-size:12px;color:var(--muted);flex:1 1 auto;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .pegang .tanda{color:var(--pilih);font-size:13px}
  #versiApp{font-size:10px;letter-spacing:.1em;color:var(--muted);
    font-family:ui-monospace,monospace;flex:none;margin-right:2px}
  .isi{overflow-y:auto;display:none}
  .sheet.buka .isi{display:block}
  .sesi{padding:2px 12px 13px}
  .sesi+.sesi{border-top:1px solid var(--rule);padding-top:12px}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.17em;color:var(--muted);margin:0 0 9px}
  .fld{margin-bottom:13px}
  .fld .nm{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
    display:block;margin-bottom:5px}
  input[type=number],input[type=text],select{font:inherit;font-family:ui-monospace,monospace;font-size:15px;
    background:var(--panel-dark);color:var(--silk);border:1px solid var(--rule);
    border-radius:2px;padding:0 10px;height:44px;width:100%}
  input[type=range]{width:100%;accent-color:var(--pilih);height:30px;margin:5px 0 0}
  .duo{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
  .duo .sat{font-family:ui-monospace,monospace;color:var(--muted);font-size:14px}
  .arah{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:4px}
  .arah button{width:100%;height:46px;font-size:16px;padding:0;letter-spacing:0}
  .pinbar{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:4px}
  .pinbar button{height:44px;font-size:11px;letter-spacing:.05em}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
    font-weight:400;text-align:right;padding:0 0 6px;border-bottom:1px solid var(--rule)}
  th:first-child{text-align:left}
  td{padding:7px 0;border-bottom:1px solid rgba(31,74,80,.45);text-align:right}
  td:first-child{text-align:left;color:var(--muted)}
  tr:last-child td{border-bottom:none}
  .kosong{color:var(--muted);font-size:12.5px;margin:0}
  /* ikon tombol: SVG sebaris supaya pasti tergambar di semua peramban,
     bukan huruf khusus yang belum tentu ada di fontnya */
  .ik{width:1.2em;height:1.2em;flex:none;vertical-align:-.2em;fill:none;
    stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  /* tombol yang HANYA berisi ikon perlu ikon lebih besar, kalau tidak
     tombolnya tampak kosong */
  .ikon .ik{width:1.6em;height:1.6em}
  .ik.isi{fill:currentColor;stroke:none}
  .menu button{gap:9px}
  .menu button .ik{width:1.05em;height:1.05em}
  .submenu{display:none;padding-left:6px;border-left:1px solid var(--rule);margin:3px 0 3px 8px}
  .menu button{text-align:left}
  .menu button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .submenu.buka{display:block}

  /* Mode proyektor: semua tulisan antarmuka dinaikkan, agar terbaca dari
     baris belakang kelas. */
  body.proyektor{font-size:17px}
  body.proyektor button{font-size:13px;height:46px}
  body.proyektor .ikon{width:50px;font-size:20px}
  body.proyektor .lbl{font-size:12px}
  body.proyektor .kosong{font-size:15px}
  body.proyektor .kan{font-size:14px}
  body.proyektor .kan button{height:34px;min-width:34px;font-size:14px}
  body.proyektor .kan .nm{min-width:96px}
  body.proyektor .kan .vd{min-width:96px}
  body.proyektor .pegang .ket{font-size:15px}
  body.proyektor #scope{height:310px}
  body.proyektor input[type=number],body.proyektor select{font-size:18px;height:52px}
  body.proyektor table{font-size:15px}
  body.proyektor th{font-size:12px}
  /* Osiloskop punya bilahnya sendiri di atas kanvas, terpisah dari panel
     detail di bawah. Keduanya bisa terbuka bersamaan: ubah nilai di bawah,
     amati kurvanya di atas. */
  .skop{position:relative;flex:none;display:none;flex-direction:column;
    background:var(--panel);border-bottom:1px solid var(--rule);padding:8px 10px 10px}
  .skop.buka{display:flex}
  #skopctl{margin-top:8px;display:flex;flex-direction:column;gap:5px}
  .kan{display:flex;flex-wrap:wrap;align-items:center;gap:6px;
    font-family:ui-monospace,monospace;font-size:11px;font-variant-numeric:tabular-nums}
  .kan i{display:inline-block;width:16px;height:3px;border-radius:2px;flex:none}
  .kan .nm{min-width:74px}
  .kan .grp2{display:flex;gap:0}
  .kan button{height:26px;min-width:26px;padding:0 7px;font-size:11px;letter-spacing:0;
    text-transform:none;border-radius:0;margin-left:-1px}
  .kan .grp2 button:first-child{border-radius:2px 0 0 2px;margin-left:0}
  .kan .grp2 button:last-child{border-radius:0 2px 2px 0}
  .kan .vd{min-width:74px;text-align:center;color:var(--pilih)}
  .kan .ket{color:var(--muted)}
  /* Blok kanal: garis tebal berwarna di tepi kiri sebagai pemisah tegas
     antara kanal 1 dan kanal 2. */
  .kanBlok{border-left:3px solid var(--rule);padding-left:9px;margin-bottom:7px}
  .kanBlok+.kanBlok{padding-top:7px;border-top:1px solid var(--rule)}
  .kanNama{font-size:12.5px;letter-spacing:.06em;min-width:26px;color:var(--silk)}
  /* Satu kendali = satu bingkai. Tombol di dalamnya tanpa bingkai sendiri,
     sehingga jelas bahwa − nilai + adalah SATU kendali, bukan tiga tombol
     yang tidak berhubungan. */
  .grp{display:inline-flex;align-items:stretch;border:1px solid var(--rule);
    border-radius:3px;overflow:hidden;flex:none}
  .grp button{border:none;border-radius:0;height:30px;min-width:31px;padding:0 7px}
  .grp button+button{border-left:1px solid var(--rule)}
  .grp .val{display:inline-flex;align-items:center;justify-content:center;
    min-width:84px;padding:0 7px;color:var(--pilih);font-size:11.5px;
    font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums;
    border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
  .cap{font-size:9px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--muted);margin-right:1px;white-space:nowrap}
  /* Label dan kendalinya adalah SATU satuan: kalau barisnya penuh, keduanya
     turun bersama, bukan labelnya tertinggal di baris atas. */
  .set{display:inline-flex;align-items:center;gap:6px;flex:none}
  /* Tab kendali: tampilan awal CRO hanya layar + baris tab kecil ini, jadi
     panelnya tidak lagi memakan setengah layar HP. */
  .tabs{gap:5px;align-items:center}
  .tabs .tab{height:28px;min-width:38px;padding:0 10px;font-size:11px;
    border-radius:3px 3px 0 0;border-bottom-color:transparent}
  .tabs .tab[aria-pressed=true]{border-bottom-color:var(--pilih);
    background:rgba(134,182,222,.12)}
  .tabs .tumbuh{flex:1 1 auto}
  .tabs .kecil{height:28px;min-width:32px;padding:0 8px;font-size:14px}
  .tabpanel{border-top:1px solid var(--rule);padding-top:7px;margin-top:1px}
  body.proyektor .grp .val{min-width:104px}
  body.proyektor .grp button{height:38px;min-width:38px}
  .kanGlob{border-top:1px solid var(--rule);padding-top:8px;margin-top:2px}
  /* Ruang kendali bertinggi tetap: layar skop tidak bergeser saat kanal
     muncul atau hilang — seperti osiloskop yang layarnya memang tidak pindah. */
  #skopctl{min-height:0}

  /* ---- pemadatan untuk layar sempit (HP) ---- */
  @media(max-width:600px){
    .bar{gap:5px;padding:6px}
    /* hanya yang sering dipakai saat mengajar tinggal di bilah; sisanya
       pindah ke menu ⋯ yang sudah bisa digulir */
    /* Undo dan redo TETAP di bilah: saat menyunting di HP keduanya dipakai
       terus-menerus, dan menyembunyikannya di menu justru menyulitkan. */
    #bJeda,#bPas,#bSkala,#bTampil,#bReset{display:none}
    #bPower span,#bTambah span{display:none}
    #bPower,#bTambah{min-width:44px;padding:0 10px}
    .lebar-saja{display:none !important}
    #skopctl{min-height:0}
    .kan{gap:5px;font-size:11px}
    .kan .nm{min-width:0}
    .grp .val{min-width:70px;font-size:11px}
    .grp button{min-width:29px;padding:0 5px}
    .kan button{min-width:30px;padding:0 7px}
    /* mode proyektor tidak berguna di HP */
    #mProyektor{display:none}
    #scope{height:222px}
  }
  .skoptb{position:absolute;top:6px;right:52px;z-index:6;height:36px;padding:0 12px;
    font-size:11px;border-radius:18px;border-color:var(--rule);color:var(--silk);
    background:rgba(14,37,41,.92)}
  /* melayang di atas segalanya di dalam bilah: apa pun yang terjadi pada
     tata letak, tombol tutup ini tetap terlihat dan bisa ditekan */
  .skopx{position:absolute;top:6px;right:8px;z-index:6;
    width:36px;height:36px;padding:0;font-size:19px;line-height:1;letter-spacing:0;
    border-radius:18px;border-color:var(--pilih);color:var(--pilih);
    background:rgba(14,37,41,.92)}
  /* Seluruh isi layar skop digambar DI DALAM kanvas ini — kisi, sumbu,
     keterangan kanal. Tidak ada elemen bersaudara yang bisa terdorong
     keluar, jadi tidak ada lagi bagian yang terpotong. */
  #scope{position:static;width:100%;height:236px;display:block;background:var(--panel-dark);
    border:1px solid var(--rule);border-radius:2px}

  .tirai{position:fixed;inset:0;background:rgba(6,18,20,.6);z-index:30;display:none}
  .tirai.buka{display:block}
  .palet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--panel);
    border-top:1px solid var(--rule);border-radius:10px 10px 0 0;padding:14px;
    transform:translateY(102%);transition:transform .18s ease}
  .palet.buka{transform:none}
  .kisi7{display:grid;grid-template-columns:1fr 1fr;gap:7px;
    max-height:min(70vh,560px);overflow-y:auto}
  .kisi7 button.pk{height:46px;justify-content:flex-start;gap:9px;padding:0 10px;
    font-size:12px;text-transform:none;letter-spacing:0;text-align:left}
  .kisi7 button.pk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  body.proyektor .kisi7 button.pk{height:58px;font-size:14px}
</style>
</head>
<body>

<div class="bar">
  <button class="pw" id="bPower" aria-pressed="false"><svg class="ik" viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.5 6.5a8 8 0 1 0 11 0"/></svg><span>Power</span></button>
  <button id="bJeda" aria-pressed="false" title="Bekukan waktu simulasi"><svg class="ik" viewBox="0 0 24 24" style="stroke-width:3.4"><path d="M9 5v14M15 5v14"/></svg><span>Jeda</span></button>
  <button class="tambah" id="bTambah"><svg class="ik" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Tambah</span></button>
  <span class="tumbuh"></span>
  <button class="ikon" id="bReset" title="Nolkan waktu &amp; muatan"><svg class="ik" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 8-8"/><path d="M12 1.5V6.5L8 4"/></svg></button>
  <button id="bTampil" title="Apa yang ditampilkan di kanvas"><svg class="ik" viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h13"/></svg><span>Bersih</span></button>
  <button class="ikon" id="bPas" title="Paskan tampilan"><svg class="ik" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="bSkop" aria-pressed="false" title="Layar osiloskop"><svg class="ik" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M5.5 14c2-6 4 6 6 0s3-4 4 2"/></svg><span>Skop</span></button>
  <button id="bSkala" title="Kecepatan waktu">0,2×</button>
  <button class="ikon" id="bUndo" title="Urungkan" disabled><svg class="ik" viewBox="0 0 24 24"><path d="M4 9h9a5 5 0 0 1 0 10H8"/><path d="M8 4.5L3.5 9 8 13.5"/></svg></button>
  <button class="ikon" id="bRedo" title="Ulangi" disabled><svg class="ik" viewBox="0 0 24 24"><path d="M20 9h-9a5 5 0 0 0 0 10h5"/><path d="M16 4.5L20.5 9 16 13.5"/></svg></button>
  <button class="ikon" id="bMenu" title="Lainnya"><svg class="ik" viewBox="0 0 24 24" style="stroke-width:4.6"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg></button>
  <div class="menu" id="menu">
    <button id="mLabel"><svg class="ik" viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h13"/></svg><span>Label tegangan &amp; arus</span><span id="nLabel" style="margin-left:auto;color:var(--pilih)"></span></button>
    <button id="mJeda2"><svg class="ik" viewBox="0 0 24 24" style="stroke-width:3.4"><path d="M9 5v14M15 5v14"/></svg><span>Waktu</span><span id="nJeda" style="margin-left:auto;color:var(--pilih)"></span></button>
    <button id="mUndo2"><svg class="ik" viewBox="0 0 24 24"><path d="M4 9h9a5 5 0 0 1 0 10H8"/><path d="M8 4.5L3.5 9 8 13.5"/></svg><span>Urungkan</span></button>
    <button id="mRedo2"><svg class="ik" viewBox="0 0 24 24"><path d="M20 9h-9a5 5 0 0 0 0 10h5"/><path d="M16 4.5L20.5 9 16 13.5"/></svg><span>Ulangi</span></button>
    <button id="mSkalaBuka"><svg class="ik" viewBox="0 0 24 24"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/></svg><span>Kecepatan</span><span id="mSkalaNilai" style="margin-left:auto;color:var(--pilih)"></span></button>
    <div class="submenu" id="subSkala"></div>
    <button id="mReset2"><svg class="ik" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 8-8"/><path d="M12 1.5V6.5L8 4"/></svg><span>Reset waktu &amp; muatan</span></button>
    <button id="mPasang" style="display:none"><svg class="ik" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M4 18v2h16v-2"/></svg><span>Pasang aplikasi</span></button>
    <button id="mProyektor"><svg class="ik" viewBox="0 0 24 24"><path d="M3 5h18v11H3z"/><path d="M8 19h8"/><path d="M12 16v3"/></svg><span>Mode proyektor</span><span id="nProy" style="margin-left:auto;color:var(--pilih)"></span></button>
    <button id="mKotak"><svg class="ik" viewBox="0 0 24 24" style="stroke-dasharray:3 2.5"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg><span>Tampilkan kotak area klik</span><span id="nKotak" style="margin-left:auto;color:var(--pilih)"></span></button>
    <button id="mPas"><svg class="ik" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Paskan tampilan</button>
    <hr>
    <button id="mContohBuka"><svg class="ik" viewBox="0 0 24 24"><path d="M4 5h7l2 2h7v12H4z"/></svg><span>Contoh rangkaian</span><span style="margin-left:auto">▾</span></button>
    <div class="submenu" id="subContoh">
      <button id="mContoh">seri–paralel DC</button>
      <button id="mContohRC">pengisian RC</button>
      <button id="mContohLED">LED &amp; pembatas arus</button>
      <button id="mContohPS">penyearah jembatan + filter</button>

<script>
"use strict";
/* ==========================================================================
   1. MESIN HITUNG — sudah lulus uji terhadap rumus RC/RL analitik
   (simpangan < 0,2%). Murni angka, tidak menyentuh DOM.
   Kapasitor dan induktor dimodelkan dengan companion model Euler mundur:
     Kapasitor : i = (C/h)(v - v_lalu)        -> konduktansi C/h + sumber arus
     Induktor  : i = i_lalu + (h/L)v          -> konduktansi h/L + sumber arus
   Euler mundur dipilih karena stabil tanpa syarat: langkah waktu sebesar
   apa pun tidak akan membuat hasilnya berosilasi liar. Harganya adalah
   galat orde satu, jadi h dibuat kecil dan disubstep per bingkai.
   ========================================================================== */
/* --- penyelesai di tempat: tidak menyalin matriks tiap langkah ----------- */
function selesaikanDalam(A,z,n){          /* A: Float64Array n*n (baris utama) */
  for(let k=0;k<n;k++){
    let p=k, maks=Math.abs(A[k*n+k]);
    for(let i=k+1;i<n;i++){
      const v=Math.abs(A[i*n+k]);
      if(v>maks){maks=v;p=i}
    }
    if(maks<1e-15) continue;
    if(p!==k){
      for(let j=k;j<n;j++){const t=A[k*n+j];A[k*n+j]=A[p*n+j];A[p*n+j]=t}
      const t=z[k]; z[k]=z[p]; z[p]=t;
    }
    const piv=A[k*n+k];
    for(let i=k+1;i<n;i++){
      const f=A[i*n+k]/piv;
      if(f===0) continue;
      A[i*n+k]=0;
      for(let j=k+1;j<n;j++) A[i*n+j]-=f*A[k*n+j];
      z[i]-=f*z[k];
    }
  }
  for(let i=n-1;i>=0;i--){
    const d=A[i*n+i];
    if(Math.abs(d)<1e-15){z[i]=0;continue}
    let s=z[i];
    for(let j=i+1;j<n;j++) s-=A[i*n+j]*z[j];
    z[i]=s/d;
  }
  return z;
}

/* --- penyangga yang dipakai ulang --------------------------------------- */
let bufA=null, bufZ=null, bufN=-1;
function siapkanBuf(N){
  if(N!==bufN){ bufA=new Float64Array(N*N); bufZ=new Float64Array(N); bufN=N }
  else { bufA.fill(0); bufZ.fill(0) }
}

/* --- sambungan (sama seperti versi sebelumnya) --------------------------- */
function bikinNet(M){
  const induk=new Map();
  const cari=k=>{ if(!induk.has(k)) induk.set(k,k);
    let r=k; while(induk.get(r)!==r) r=induk.get(r);
    let c=k; while(induk.get(c)!==c){const nx=induk.get(c);induk.set(c,r);c=nx}
    return r; };
  const gabung=(a,b)=>{const ra=cari(a),rb=cari(b); if(ra!==rb) induk.set(ra,rb)};
  for(const k of M.komponen) k.pin.forEach((_,i)=>cari(k.id+':'+i));
  for(const w of M.kawat) gabung(w.a,w.b);
  let akarMassa=null;
  for(const k of M.komponen) if(k.jenis==='massa') akarMassa=cari(k.id+':0');
  const idx=new Map(); let berikut=1;
  const nomor=k=>{
    const r=cari(k);
    if(akarMassa!==null && r===cari(akarMassa)) return 0;
    if(!idx.has(r)) idx.set(r,berikut++);
    return idx.get(r);
  };
  const petaSimpul=new Map();
  for(const k of M.komponen) k.pin.forEach((_,i)=>{
    const key=k.id+':'+i; petaSimpul.set(key,nomor(key));
  });
  return {petaSimpul,jumlah:berikut,adaMassa:akarMassa!==null,akar:cari};
}

/* --- keadaan dinamis: tegangan kapasitor & arus induktor ----------------- */
const keadaan=new Map();
let tSim=0;
function resetKeadaan(){ keadaan.clear(); tSim=0 }
const ambil=(id,bawaan)=>keadaan.has(id)?keadaan.get(id):bawaan;

const FARAD = k=>Math.max(k.prop.C,1e-4)*1e-6;   /* prop.C dalam µF */
const HENRY = k=>Math.max(k.prop.L,1e-3)*1e-3;   /* prop.L dalam mH */
const adaDinamis = M=>M.komponen.some(k=>k.jenis==='kapasitor'||k.jenis==='induktor'||k.jenis==='trafo');

/* ===== komponen tak-linear =================================================
   Dioda memakai persamaan Shockley. Karena arusnya eksponensial, satu kali
   penyelesaian matriks tidak cukup: tiap langkah waktu harus diulang dengan
   Newton-Raphson sampai tegangan dioda berhenti berubah.
   ========================================================================= */
const VT=0.025852;                     /* kT/q pada suhu ruang */
const DIODA_JENIS={
  dioda : {Is:2.52e-9, n:1.752, Vz:0,  Ibv:0},      /* mirip 1N4148 */
  led   : {Is:3.2e-19, n:2.0,   Vz:0,  Ibv:0},      /* Vf sekitar 2 V */
  zener : {Is:1e-9,    n:1.0,   Vz:5.1,Ibv:1e-6}    /* Vz dari properti */
};
/* exp dipotong secara linear di atas 80 supaya tidak meluap menjadi Infinity */
const EXP_BATAS=60;
function expAman(x){
  if(x>EXP_BATAS){ const e=Math.exp(EXP_BATAS); return e*(1+(x-EXP_BATAS)) }
  return Math.exp(x);
}
function arusDioda(p,v){
  const nvt=p.n*VT;
  const e=expAman(v/nvt);
  let I=p.Is*(e-1), g=p.Is*e/nvt;
  if(p.Ibv>0){                          /* cabang dadal balik untuk zener */
    const ez=expAman(-(v+p.Vz)/nvt);
    I-=p.Ibv*(ez-1);
    g+=p.Ibv*ez/nvt;
  }
  return {I,g:g+1e-12};                 /* gmin: menolong konvergensi */
}
/* Pembatasan langkah tegangan sambungan p-n. Tanpa ini, satu iterasi bisa
   melompat ke exp(600) dan Newton-Raphson tidak akan pernah pulih. */
function batasiPN(vbaru,vlama,nvt,vkritis){
  if(vbaru>vkritis && Math.abs(vbaru-vlama)>2*nvt){
    if(vlama>0){
      const arg=1+(vbaru-vlama)/nvt;
      vbaru = arg>0 ? vlama+nvt*Math.log(arg) : vkritis;
    }else if(vbaru>0){
      vbaru=nvt*Math.log(vbaru/nvt);
    }
  }
  return vbaru;
}
/* Zener punya DUA sambungan eksponensial: maju, dan dadal balik pada -Vz.
   Keduanya harus dibatasi. Membatasi sisi maju saja membuat iterasi pertama
   melompat ke tegangan balik penuh, lalu cabang dadal menghasilkan
   konduktansi sebesar 1e38 dan penyelesaian matriksnya hancur. */
function batasiDioda(d,vbaru){
  let v=batasiPN(vbaru,d.v,d.nvt,d.vkritis);
  if(d.p.Ibv>0){
    const u=batasiPN(-(v+d.p.Vz), -(d.v+d.p.Vz), d.nvt, d.vkritisBD);
    v=-(u+d.p.Vz);
  }
  return v;
}
/* ===== transistor bipolar (Ebers-Moll bentuk transport) ==================
   Tiga kaki, jadi linearisasinya bukan satu konduktansi melainkan matriks
   Jacobi 3x3. Di sinilah kesalahan paling mudah bersembunyi: rumus arusnya
   bisa benar tetapi penempelannya ke matriks salah tanda, dan hasilnya
   tetap "terlihat masuk akal".
   Kaki: 0 = basis, 1 = kolektor, 2 = emitor.
   ========================================================================= */
const TR_JENIS={
  npn:{Is:1e-14,nf:1,nr:1,bf:100,br:1,sg: 1},
  pnp:{Is:1e-14,nf:1,nr:1,bf:100,br:1,sg:-1}
};
function arusTransistor(p,vbe,vbc){
  const nvf=p.nf*VT, nvr=p.nr*VT;
  const ef=expAman(vbe/nvf), er=expAman(vbc/nvr);
  const Ic=p.Is*((ef-er)-(er-1)/p.br);
  const Ib=p.Is*((ef-1)/p.bf+(er-1)/p.br);
  /* turunan terhadap vbe dan vbc */
  const gcf= p.Is*ef/nvf;
  const gcr=-p.Is*er/nvr*(1+1/p.br);
  const gbf= p.Is*ef/(p.bf*nvf);
  const gbr= p.Is*er/(p.br*nvr);
  return {Ic,Ib,gcf,gcr,gbf,gbr};
}
/* ===== op-amp ==============================================================
   Keluaran = Vsat * tanh(A * vd / Vsat). Penjenuhan dibuat mulus, bukan
   dipatok keras, supaya Newton-Raphson punya turunan di mana-mana; patokan
   keras membuat iterasi berayun di ambang jenuh.
   Kaki: 0 = masukan +, 1 = masukan -, 2 = keluaran.
   ========================================================================= */
const OA_A=1e5;
function keluaranOA(vd,vsat){
  const x=OA_A*vd/vsat, th=Math.tanh(x);
  return {V:vsat*th, dV:OA_A*(1-th*th)};
}
const tegOA=new Map();
const tegTrans=new Map();     /* {vbe,vbc} awal iterasi berikutnya */
const tegDioda=new Map();              /* tegangan dioda, awal iterasi berikutnya */

/* nilai sumber pada saat t (AC dievaluasi di ujung langkah) */
function nilaiSumber(x,t){
  if(x.jenis==='ampere') return 0;
  if(x.jenis==='ac') return x.ofs + x.Vp*Math.sin(2*Math.PI*x.f*t + x.fase*Math.PI/180);
  return x.E;
}

/* Rencana stamping disusun SEKALI per bingkai — topologi tidak berubah di
   tengah bingkai — lalu tiap substep hanya mengisi angka. */
function susunRencana(M,net){
  const sim=k=>net.petaSimpul.get(k);
  const res=[],src=[],dyn=[],nl=[],tr=[],tf=[],oa=[];
  /* Beberapa komponen butuh simpul dalam yang tidak punya kaki — mis. titik
     antara resistansi belitan dan belitan ideal pada trafo. */
  let jumlahSimpul=net.jumlah;
  const simpulDalam=()=>jumlahSimpul++;
  for(const k of M.komponen){
    const a=sim(k.id+':0'), b=sim(k.id+':1');
    switch(k.jenis){
      case 'resistor':  res.push({id:k.id,a,b,g:1/Math.max(k.prop.R,1e-9)}); break;
      case 'potensio':{
        /* Potensiometer tidak butuh mesin baru: ia dua resistor yang berbagi
           simpul penyapu. */
        const R=Math.max(k.prop.R,1e-9);
        const kk=Math.min(Math.max(k.prop.pos,0),1);
        const w=sim(k.id+':1'), u2=sim(k.id+':2');
        /* pos adalah KEDUDUKAN penyapu diukur dari kaki 1, sesuai letak panah
           yang digambar. Sebelumnya terbalik: panah di kaki 1 tetapi
           resistansi ke kaki 1 justru maksimum. */
        res.push({id:k.id+'#a',a,b:w,g:1/Math.max(R*kk,1e-3)});
        res.push({id:k.id+'#b',a:w,b:u2,g:1/Math.max(R*(1-kk),1e-3)});
        break;
      }
      case 'trafo':{
        const n=Math.max(k.prop.n,1e-4);
        const s1=sim(k.id+':2'), s2=sim(k.id+':3');
        const pA=simpulDalam(), sA=simpulDalam();
        /* p1 -Rp- pA -[belitan ideal + Lm]- p2 ;  s1 -Rs- sA */
        res.push({id:k.id+'#rp',a,b:pA,g:1/Math.max(k.prop.Rp,1e-3)});
        res.push({id:k.id+'#rs',a:s1,b:sA,g:1/Math.max(k.prop.Rs,1e-3)});
        tf.push({id:k.id,p1:pA,p2:b,s1:sA,s2,n});
        /* Induktansi magnetisasi. Bersama resistansi belitan, inilah yang
           membuat trafo MEMBLOKIR DC: arus magnetisasi menanjak sampai
           dibatasi Rp, dan tegangan imbas turun ke nol. */
        dyn.push({id:k.id+'#m',a:pA,b,jenis:'L',nilai:Math.max(k.prop.Lm,1e-3)});
        break;
      }
      case 'opamp':{
        oa.push({id:k.id,p:a,m:b,o:sim(k.id+':2'),
                 vsat:Math.max(k.prop.Vsat,0.5),
                 vd:tegOA.has(k.id)?tegOA.get(k.id):0});
        break;
      }
      case 'saklar':    res.push({id:k.id,a,b,g:k.prop.tutup?1e4:1e-12}); break;
      case 'kapasitor': dyn.push({id:k.id,a,b,jenis:'C',nilai:FARAD(k)}); break;
      case 'induktor':  dyn.push({id:k.id,a,b,jenis:'L',nilai:HENRY(k)}); break;
      case 'sumber':    src.push({id:k.id,a,b,jenis:'dc',E:k.prop.E}); break;
      case 'sumberac':  src.push({id:k.id,a,b,jenis:'ac',Vp:k.prop.Vp,f:k.prop.f,
                                  ofs:k.prop.ofs||0,fase:k.prop.fase||0}); break;
      case 'ampere':    src.push({id:k.id,a,b,jenis:'ampere'}); break;
      case 'npn': case 'pnp':{
        const p=Object.assign({},TR_JENIS[k.jenis]);
        p.bf=Math.max(k.prop.bf||100,1);
        const lalu=tegTrans.get(k.id)||{vbe:0,vbc:0};
        const nvf=p.nf*VT;
        tr.push({id:k.id,p,
                 b:sim(k.id+':0'), c:sim(k.id+':1'), e:sim(k.id+':2'),
                 nvf,vkritis:nvf*Math.log(nvf/(Math.SQRT2*p.Is)),
                 vbe:lalu.vbe, vbc:lalu.vbc});
        break;
      }
      case 'dioda': case 'led': case 'zener':{
        const d=Object.assign({},DIODA_JENIS[k.jenis]);
        if(k.jenis==='zener') d.Vz=Math.max(k.prop.Vz,0.5);
        const nvt=d.n*VT;
        nl.push({id:k.id,a,b,p:d,nvt,
                 vkritis:nvt*Math.log(nvt/(Math.SQRT2*d.Is)),
                 vkritisBD:d.Ibv>0?nvt*Math.log(nvt/(Math.SQRT2*d.Ibv)):0,
                 v:tegDioda.has(k.id)?tegDioda.get(k.id):0});
        break;
      }
    }
  }
  const n=Math.max(jumlahSimpul-1,0);
  let baris=n;
  src.forEach(x=>x.r=baris++);
  tf.forEach(x=>x.r=baris++);      /* satu peubah arus primer per trafo */
  oa.forEach(x=>x.r=baris++);      /* satu peubah arus keluaran per op-amp */
  return {n,N:baris,res,src,dyn,nl,tr,tf,oa,jumlah:jumlahSimpul};
}

let bufV=null;
/* toleransi bergaya SPICE: mutlak 1 µV ditambah 0,1% dari nilainya.
   Toleransi mutlak yang terlalu ketat membuat iterasi tak pernah 'selesai'
   padahal jawabannya sudah cukup baik. */
const MAKS_ITER=100, VNTOL=1e-6, RELTOL=1e-3;
/* penuh=false: hanya majukan keadaan, tanpa menyusun Map arus. */
function langkahRencana(R,h,penuh,tUjung){
  const N=R.N;
  if(N===0) return {V:[0],arusKomp:new Map(),iter:0,konvergen:true};
  const takLinear=R.nl.length>0||R.tr.length>0||R.oa.length>0;
  const maksIter=takLinear?MAKS_ITER:1;
  if(!bufV||bufV.length!==R.jumlah) bufV=new Array(R.jumlah).fill(0);
  const V=bufV;
  let x=null, iter=0, konvergen=!takLinear;

  for(iter=1;iter<=maksIter;iter++){
    siapkanBuf(N);
    const A=bufA, z=bufZ;
    const G=(a,b,g)=>{
      if(a>0) A[(a-1)*N+(a-1)]+=g;
      if(b>0) A[(b-1)*N+(b-1)]+=g;
      if(a>0&&b>0){ A[(a-1)*N+(b-1)]-=g; A[(b-1)*N+(a-1)]-=g }
    };
    const Isrc=(a,b,I)=>{ if(a>0) z[a-1]-=I; if(b>0) z[b-1]+=I };

    for(const e of R.res) G(e.a,e.b,e.g);
    for(const d of R.dyn){
      d.lalu=keadaan.has(d.id)?keadaan.get(d.id):0;
      if(d.jenis==='C'){ d.Geq=d.nilai/h; G(d.a,d.b,d.Geq); Isrc(d.a,d.b,-d.Geq*d.lalu) }
      else             { d.Geq=h/d.nilai; G(d.a,d.b,d.Geq); Isrc(d.a,d.b,d.lalu) }
    }
    for(const d of R.nl){                 /* linearisasi di sekitar d.v */
      const {I,g}=arusDioda(d.p,d.v);
      d.g=g; d.Ilin=I;
      G(d.a,d.b,g);
      Isrc(d.a,d.b,I-g*d.v);
    }
    for(const t of R.tr){
      const sg=t.p.sg;
      const {Ic,Ib,gcf,gcr,gbf,gbr}=arusTransistor(t.p,t.vbe,t.vbc);
      t.Ic=sg*Ic; t.Ib=sg*Ib;
      /* arus yang MENINGGALKAN tiap kaki, dinyatakan dalam vbe & vbc */
      const simpul=[t.b,t.c,t.e];
      const L=[sg*Ib, sg*Ic, -sg*(Ib+Ic)];
      /* baris: d(arus keluar kaki i)/dV(kaki j)  — vbe=vb-ve, vbc=vb-vc */
      const J=[
        [ gbf+gbr, -gbr, -gbf ],
        [ gcf+gcr, -gcr, -gcf ],
        [ -(gbf+gbr+gcf+gcr), gbr+gcr, gbf+gcf ]
      ];
      /* Titik linearisasi harus dinyatakan dalam koordinat TEGANGAN SIMPUL,
         bukan peubah internal vbe/vbc. Untuk PNP (sg=-1) keduanya berbeda
         tanda, dan kalau tertukar hasilnya salah tanpa terlihat salah. */
      const Vlin=[sg*t.vbe, sg*(t.vbe-t.vbc), 0];   /* [Vb, Vc, Ve], Ve=0 lokal */
      for(let i=0;i<3;i++){
        const a=simpul[i]; if(a<=0) continue;
        let ieq=L[i];
        for(let j=0;j<3;j++){
          ieq-=J[i][j]*Vlin[j];
          const bb=simpul[j];
          if(bb>0) A[(a-1)*N+(bb-1)]+=J[i][j];
        }
        z[a-1]-=ieq;
      }
      /* gmin lemah pada kedua sambungan, menolong konduksi awal */
      G(t.b,t.e,1e-12); G(t.b,t.c,1e-12);
    }
    /* Trafo ideal: Vs = n*Vp dan Is = -Ip/n, dengan satu peubah arus primer.
       Baris kendala menegakkan hubungan tegangannya; kolomnya menyalurkan
       arus ke kedua belitan dengan perbandingan sama, sehingga daya kekal. */
    for(const w of R.tf){
      const r=w.r, inv=1/w.n;
      if(w.p1>0){ A[(w.p1-1)*N+r]+=1;   A[r*N+(w.p1-1)]-=w.n }
      if(w.p2>0){ A[(w.p2-1)*N+r]-=1;   A[r*N+(w.p2-1)]+=w.n }
      if(w.s1>0){ A[(w.s1-1)*N+r]-=inv; A[r*N+(w.s1-1)]+=1 }
      if(w.s2>0){ A[(w.s2-1)*N+r]+=inv; A[r*N+(w.s2-1)]-=1 }
      z[r]=0;
    }
    for(const o of R.oa){
      const ke=keluaranOA(o.vd,o.vsat);
      o.vo=ke.V; o.dV=ke.dV;
      const r=o.r;
      if(o.o>0){ A[(o.o-1)*N+r]+=1; A[r*N+(o.o-1)]+=1 }
      if(o.p>0) A[r*N+(o.p-1)]-=ke.dV;
      if(o.m>0) A[r*N+(o.m-1)]+=ke.dV;
      z[r]=ke.V-ke.dV*o.vd;
    }
    for(const q of R.src){
      if(q.a>0){ A[(q.a-1)*N+q.r]+=1; A[q.r*N+(q.a-1)]+=1 }
      if(q.b>0){ A[(q.b-1)*N+q.r]-=1; A[q.r*N+(q.b-1)]-=1 }
      z[q.r]=nilaiSumber(q,tUjung);
    }
    x=selesaikanDalam(A,z,N);
    V[0]=0;
    for(let i=1;i<R.jumlah;i++) V[i]=x[i-1];
    if(!takLinear){
      for(let i=1;i<R.jumlah;i++) if(!isFinite(V[i])){konvergen=false;V[i]=0}
      break;
    }

    /* Penjaga NaN: tanpa ini, NaN lolos dari pemeriksaan konvergensi karena
       perbandingan apa pun dengan NaN bernilai false. */
    let rusak=false;
    for(let i=1;i<R.jumlah;i++) if(!isFinite(V[i])) rusak=true;
    if(rusak){ konvergen=false; break }
    let cukup=true;
    for(const o of R.oa){
      let vd=V[o.p]-V[o.m];
      /* vd ditentukan oleh rangkaian, bukan peubah yang perlu dicekik.
         Versi pertama membatasinya beberapa milivolt per iterasi, sehingga
         pembanding dengan selisih 0,5 V perlu ratusan iterasi untuk merambat
         sampai ke sana. Pembatas kini longgar, dan tanh sendiri sudah
         menjamin keluarannya terbatas. */
      const batas=Math.max(o.vsat*0.5,1e-3);
      if(Math.abs(vd-o.vd)>batas) vd=o.vd+Math.sign(vd-o.vd)*batas;
      if(Math.abs(vd-o.vd)>1e-9+RELTOL*Math.abs(vd)) cukup=false;
      o.vd=vd;
    }
    for(const t of R.tr){
      const sg=t.p.sg;
      let vbe=sg*(V[t.b]-V[t.e]), vbc=sg*(V[t.b]-V[t.c]);
      vbe=batasiPN(vbe,t.vbe,t.nvf,t.vkritis);
      vbc=batasiPN(vbc,t.vbc,t.nvf,t.vkritis);
      if(Math.abs(vbe-t.vbe)>VNTOL+RELTOL*Math.abs(vbe)) cukup=false;
      if(Math.abs(vbc-t.vbc)>VNTOL+RELTOL*Math.abs(vbc)) cukup=false;
      t.vbe=vbe; t.vbc=vbc;
    }
    for(const d of R.nl){
      const vb=batasiDioda(d, V[d.a]-V[d.b]);
      if(Math.abs(vb-d.v) > VNTOL+RELTOL*Math.abs(vb)) cukup=false;
      d.v=vb;
    }
    if(cukup){ konvergen=true; break }
  }
  const arusKomp=penuh?new Map():null;
  if(penuh){
    for(const e of R.res) arusKomp.set(e.id,(V[e.a]-V[e.b])*e.g);
    for(const q of R.src) arusKomp.set(q.id,x[q.r]);
    for(const d of R.nl) arusKomp.set(d.id,arusDioda(d.p,V[d.a]-V[d.b]).I);
    for(const w of R.tf){
      arusKomp.set(w.id,x[w.r]);
      arusKomp.set(w.id+'#s',-x[w.r]/w.n);
    }
    for(const o of R.oa) arusKomp.set(o.id,x[o.r]);
    for(const t of R.tr){
      const sg=t.p.sg, a=arusTransistor(t.p,sg*(V[t.b]-V[t.e]),sg*(V[t.b]-V[t.c]));
      arusKomp.set(t.id,sg*a.Ic);              /* yang dilaporkan: arus kolektor */
      arusKomp.set(t.id+'#b',sg*a.Ib);
    }
  }
  for(const d of R.dyn){
    const v=V[d.a]-V[d.b];
    if(d.jenis==='C'){ d.akhir=v;               if(penuh) arusKomp.set(d.id,d.Geq*(v-d.lalu)) }
    else             { d.akhir=d.lalu+d.Geq*v;  if(penuh) arusKomp.set(d.id,d.akhir) }
  }
  /* Salin V bila hasilnya akan dipegang pemanggil. Tanpa ini, dua hasil
     yang disimpan berurutan menunjuk ke penyangga yang sama, dan yang lama
     ikut berubah — jebakan yang sulit terlihat. */
  return {V:penuh?V.slice():V,x,arusKomp:arusKomp||new Map(),iter,konvergen};
}

/* Keadaan baru hanya dituliskan SETELAH langkahnya diterima. Percobaan yang
   gagal konvergen karena itu tidak sempat mengotori muatan kapasitor. */
function komit(R){
  for(const o of R.oa) tegOA.set(o.id,o.vd);
  for(const t of R.tr) tegTrans.set(t.id,{vbe:t.vbe,vbc:t.vbc});
  for(const d of R.nl) tegDioda.set(d.id,d.v);
  for(const d of R.dyn) keadaan.set(d.id,d.akhir);
}

/* Maju sejumlah waktu simulasi.
   h dipilih dari waktu yang diminta; makin lambat pemutaran, makin kecil h,
   jadi gerak lambat sekaligus lebih akurat. */
const H_MAKS=10e-6, H_MIN=1e-7, SUBSTEP_TARGET=150, MAKS_SUBSTEP=6000;
/* Banyaknya cuplikan yang diinginkan di dalam satu jendela layar. Inilah yang
   menentukan kehalusan gambar sinyal: 1600 cuplikan untuk lebar layar jauh
   melebihi jumlah pikselnya, jadi bentuknya mulus bahkan pada 20 kHz. */
const CUPLIK_PER_JENDELA=2400;
const pilihH=dtSim=>Math.min(Math.max(dtSim/SUBSTEP_TARGET,H_MIN),H_MAKS);
const TAK_LINEAR=['dioda','led','zener','npn','pnp'];
const adaTakLinear=M=>M.komponen.some(k=>TAK_LINEAR.indexOf(k.jenis)>=0);
const adaAC=M=>M.komponen.some(k=>k.jenis==='sumberac');
const perluWaktu=M=>adaDinamis(M)||adaAC(M);

function majuWaktu(M,dtSim,alatCuplik,dtCuplik){
  const net=bikinNet(M);
  if(!net.adaMassa) return {ok:false,alasan:'tanpaMassa',net,dtTerpakai:0};
  const R=susunRencana(M,net);
  const takLinear=R.nl.length>0||R.tr.length>0;

  /* ===== rencana pencuplikan ==============================================
     Sebelumnya jejak osiloskop dicuplik sekali per BINGKAI, sehingga laju
     cuplikannya hanya 1/dtSim — pada 0,01x itu 6 kHz, dan sinyal 1 kHz pun
     sudah tampak bersegi. Padahal solver melangkah 1,1 us (900 kHz).
     Sekarang pencuplikan dilakukan DI DALAM putaran substep. Simpul dan
     baris matriksnya dipetakan sekali di sini, jadi tiap cuplikan hanya
     berupa pembacaan array. */
  const cuplik=[];
  if(alatCuplik && alatCuplik.length){
    for(const a of alatCuplik){
      if(a.jenis==='ampere'){
        const q=R.src.find(x=>x.id===a.id);
        cuplik.push({id:a.id,tipe:'i',r:q?q.r:-1,v:[]});
      }else{
        cuplik.push({id:a.id,tipe:'v',v:[],
          a:net.petaSimpul.get(a.id+':0')||0,
          b:(a.jenis==='volt'?(net.petaSimpul.get(a.id+':1')||0):0)});
      }
    }
  }
  const tCup=[];
  const dtC=Math.max(dtCuplik||0,0);
  const rekamCuplik=(rr,t)=>{
    tCup.push(t);
    for(const c of cuplik){
      c.v.push(c.tipe==='i'
        ? (c.r>=0 && rr.x ? rr.x[c.r] : 0)
        : (rr.V[c.a]-rr.V[c.b]));
    }
  };

  if(!perluWaktu(M)){
    const r=langkahRencana(R,1e-3,true,tSim);
    komit(R); tSim+=dtSim;
    if(cuplik.length) rekamCuplik(r,tSim);
    return {ok:true,net,...r,langkah:1,dtTerpakai:dtSim,h:0,
            gagal:r.konvergen?0:1,iterMaks:r.iter,cuplik,tCup};
  }
  const h=pilihH(dtSim);
  let sisa=dtSim, jml=0, r=null, pakai=0, gagal=0, iterMaks=0, kecil=0, akum=Infinity;
  while(sisa>h*1e-6 && jml<MAKS_SUBSTEP){
    let hh=Math.min(h,sisa), coba=0, rr=null;
    /* Kalau Newton-Raphson tidak konvergen, perkecil langkah waktunya dan
       coba lagi. Ini yang menyelamatkan penyearah berkapasitor. */
    for(;;){
      rr=langkahRencana(R,hh,takLinear||(sisa-hh)<=h*1e-6,tSim+hh);
      if(rr.konvergen || coba>=6 || hh<=4*H_MIN) break;
      hh/=4; coba++; kecil++;
    }
    komit(R);
    if(!rr.konvergen) gagal++;
    iterMaks=Math.max(iterMaks,rr.iter);
    tSim+=hh; sisa-=hh; pakai+=hh; jml++;
    r=rr;
    if(cuplik.length){
      akum+=hh;
      /* dtC = 0 berarti cukup satu cuplikan pada akhir bingkai */
      if(dtC<=0){ if(sisa<=h*1e-6) rekamCuplik(rr,tSim) }
      else if(akum>=dtC){ akum=0; rekamCuplik(rr,tSim) }
    }
  }
  if(!r){ r=langkahRencana(R,h,true,tSim); komit(R);
          if(cuplik.length) rekamCuplik(r,tSim) }
  return {ok:true,net,...r,langkah:jml,dtTerpakai:pakai,h,
          terpotong:sisa>h*1e-6, gagal, iterMaks, kecil, cuplik, tCup};
}


function arusPerKawat(M,net,arusKomp){
  const inj=new Map();
  const tambah=(k,v)=>inj.set(k,(inj.get(k)||0)+v);
  const pinMassa=[];
  for(const k of M.komponen){
    if(k.jenis==='massa'){ pinMassa.push(k.id+':0'); tambah(k.id+':0',0); continue }
    if(k.jenis==='potensio'){
      const ia=arusKomp.get(k.id+'#a')||0, ib=arusKomp.get(k.id+'#b')||0;
      tambah(k.id+':0',-ia); tambah(k.id+':1',ia-ib); tambah(k.id+':2',ib);
      continue;
    }
    if(k.jenis==='trafo'){
      /* yang mengalir di kaki adalah arus resistansi belitan */
      const irp=arusKomp.get(k.id+'#rp')||0, irs=arusKomp.get(k.id+'#rs')||0;
      const ip=arusKomp.get(k.id)||0, im=arusKomp.get(k.id+'#m')||0;
      tambah(k.id+':0',-irp); tambah(k.id+':1',ip+im);
      tambah(k.id+':2',-irs); tambah(k.id+':3',arusKomp.get(k.id+'#s')||0);
      continue;
    }
    if(k.jenis==='opamp'){
      const io=arusKomp.get(k.id)||0;
      tambah(k.id+':0',0); tambah(k.id+':1',0); tambah(k.id+':2',-io);
      continue;
    }
    if(k.jenis==='npn'||k.jenis==='pnp'){
      /* tiga kaki: arus masuk basis dan kolektor, keluar lewat emitor */
      const ic=arusKomp.get(k.id)||0, ib=arusKomp.get(k.id+'#b')||0;
      tambah(k.id+':0',-ib); tambah(k.id+':1',-ic); tambah(k.id+':2',ib+ic);
      continue;
    }
    if(k.pin.length<2){ tambah(k.id+':0',0); continue }
    const i=arusKomp.get(k.id)||0;
    tambah(k.id+':0',-i); tambah(k.id+':1',i);
  }
  for(const pm of pinMassa){
    const r=net.akar(pm); let jum=0;
    for(const [p,v] of inj) if(net.akar(p)===r && p!==pm) jum+=v;
    inj.set(pm,-jum);
  }
  const sisi=new Map();
  M.kawat.forEach((w,i)=>{
    if(!sisi.has(w.a)) sisi.set(w.a,[]);
    if(!sisi.has(w.b)) sisi.set(w.b,[]);
    sisi.get(w.a).push(i); sisi.get(w.b).push(i);
  });
  const hasilK=new Map(), hidupK=new Set(M.kawat.keys());
  const derajat=new Map();
  for(const [p,ls] of sisi) derajat.set(p,ls.length);
  const akum=new Map(inj);
  let jalan=true;
  while(jalan){
    jalan=false;
    for(const [p,d] of derajat){
      if(d!==1) continue;
      const i=sisi.get(p).find(j=>hidupK.has(j));
      if(i===undefined) continue;
      const w=M.kawat[i], lain=(w.a===p)?w.b:w.a, s=akum.get(p)||0;
      hasilK.set(i, w.a===p ? s : -s);
      akum.set(lain,(akum.get(lain)||0)+s);
      hidupK.delete(i); derajat.set(p,0);
      derajat.set(lain,(derajat.get(lain)||1)-1);
      jalan=true;
    }
  }
  for(const i of hidupK) hasilK.set(i,0);
  return hasilK;
}

let nomorBerikut=1, hidup=false;
let dipilih=null, pilihKawat=-1, pinTertunda=null, sorot=null;
/* satu penanda untuk dua pilihan tampilan: bit 1 = nilai, bit 2 = kotak klik */
let modeTampil=1;

const VERSI_APP='1.6';     /* naikkan bersama nomor VERSI di sw.js */
const VERSI_BERKAS=1;      /* naikkan bila bentuk berkas simpanan berubah */
let namaProyek='Rangkaian_'+new Date().toISOString().slice(0,16).replace(/[-:T]/g,'');
let jeda=false;                     /* waktu simulasi dibekukan di tempat */

/* ==========================================================================
   4. GEOMETRI & UJI SENTUH — murni hitungan, tanpa DOM.
   ========================================================================== */
const bulat=v=>Math.round(v/KISI)*KISI;
const px=n=>n/zoom;

/* Pegangan digambar TEPAT di titik pin (jarak 0). Versi sebelumnya
   menggesernya ke luar, dan itu membuat sasarannya rancu ketika komponen
   berdekatan: pegangan sebuah pin bisa tampak lebih dekat ke pin tetangga. */
const JAUH_PEGANGAN=0;
const R_PEGANGAN=15;         /* radius tangkap pegangan, piksel layar */
const R_TUAS=16;             /* radius tangkap tuas saklar, piksel layar */
const PAD_BADAN=4;           /* pelonggaran kotak badan, piksel layar */
const R_KAWAT=11;            /* radius tangkap kawat, piksel layar */
const AMBANG_GERAK=4;

/* cermin dilakukan LEBIH DULU pada sumbu x lokal, lalu diputar. Cermin
   tegak = cermin datar + putar 180 derajat, jadi satu penanda cukup. */
function putar(k,x,y){
  if(k.cx) x=-x;
  const c=Math.cos(k.rot*Math.PI/2), s=Math.sin(k.rot*Math.PI/2);
  return [k.x+x*c-y*s, k.y+x*s+y*c];
}
/* kebalikan putar(): dari koordinat dunia ke koordinat lokal komponen,
   sehingga kotak yang sempit tetap benar meski komponennya diputar */
function keLokal(k,wx,wy){
  const t=-k.rot*Math.PI/2, c=Math.cos(t), s=Math.sin(t);
  const dx=wx-k.x, dy=wy-k.y;
  const lx=dx*c-dy*s, ly=dx*s+dy*c;
  return [k.cx?-lx:lx, ly];
}
function posPin(k,i){
  const [dx,dy]=JENIS[k.jenis].pin[i];
  return putar(k,dx,dy);
}
function posPegangan(k,i){
  const [dx,dy]=JENIS[k.jenis].pin[i];
  let ux=dx,uy=dy,L=Math.hypot(dx,dy);
  if(L<1e-6){ux=0;uy=1;L=1}
  ux/=L; uy/=L;
  return putar(k, dx+ux*JAUH_PEGANGAN, dy+uy*JAUH_PEGANGAN);
}
const komponenOleh=id=>M.komponen.find(k=>k.id===id);
function posPinKunci(kunci){
  const [id,i]=kunci.split(':'); const k=komponenOleh(id);
  return k?posPin(k,+i):null;
}

/* --- jalur kawat ---------------------------------------------------------
   Setiap kawat menyimpan orientasi segmen tengah dan letaknya (m).
   orient 'v': segmen tengah tegak di x=m    -> p ┐ │ ┌ q
   orient 'h': segmen tengah datar di y=m
   Bila m belum pernah diatur, hasilnya sama dengan siku sederhana. */
function jalurKawat(w,p,q){
  const orient=w.orient||'v';
  const m=(w.m===undefined||w.m===null)?(orient==='v'?q[0]:q[1]):w.m;
  const kasar = orient==='v'
    ? [p,[m,p[1]],[m,q[1]],q]
    : [p,[p[0],m],[q[0],m],q];
  const out=[kasar[0]];
  for(let i=1;i<kasar.length;i++){
    const a=out[out.length-1];
    if(Math.abs(a[0]-kasar[i][0])>1e-6||Math.abs(a[1]-kasar[i][1])>1e-6) out.push(kasar[i]);
  }
  return out;
}

function peganganAktif(){
  if(pinTertunda) return M.komponen;
  if(dipilih) return [dipilih];
  return [];
}
function peganganDi(wx,wy){
  const r=px(R_PEGANGAN); let best=null, bd=r;
  for(const k of peganganAktif()) k.pin.forEach((_,i)=>{
    const [x,y]=posPegangan(k,i), d=Math.hypot(x-wx,y-wy);
    if(d<bd){bd=d;best=k.id+':'+i}
  });
  return best;
}
function badanDi(wx,wy){
  const pad=px(PAD_BADAN);
  for(let i=M.komponen.length-1;i>=0;i--){
    const k=M.komponen[i];
    const [lx,ly]=keLokal(k,wx,wy);
    const [x0,y0,x1,y1]=JENIS[k.jenis].kotak;
    if(lx>=x0-pad&&lx<=x1+pad&&ly>=y0-pad&&ly<=y1+pad) return k;
  }
  return null;
}
/* mengembalikan juga segmen mana yang tersentuh dan arahnya, karena itulah
   yang menentukan ke arah mana jalur bisa digeser */
function kawatDi(wx,wy){
  const r=px(R_KAWAT);
  for(let i=M.kawat.length-1;i>=0;i--){
    const pts=M.kawat[i].jalur||[];
    for(let j=0;j<pts.length-1;j++){
      const [ax,ay]=pts[j],[bx,by]=pts[j+1];
      const dx=bx-ax, dy=by-ay, L=Math.hypot(dx,dy);
      if(L<3) continue;
      let t=((wx-ax)*dx+(wy-ay)*dy)/(L*L); t=Math.max(0,Math.min(1,t));
      if(Math.hypot(wx-(ax+dx*t),wy-(ay+dy*t))<r)
        return {i,seg:j,tegak:Math.abs(dx)<1e-6};
    }
  }
  return null;
}
/* Satu komponen boleh punya beberapa tuas: saklar satu (buka/tutup),
   potensiometer dua (turun/naik). */
function daftarTuas(k){
  const t=JENIS[k.jenis].tuas;
  if(!t) return [];
  return t.map(u=>({aksi:u.aksi,p:putar(k,u.dx,u.dy)}));
}
function tuasDi(wx,wy){
  const r=px(R_TUAS);
  for(let i=M.komponen.length-1;i>=0;i--){
    const k=M.komponen[i];
    for(const u of daftarTuas(k))
      if(Math.hypot(u.p[0]-wx,u.p[1]-wy)<r) return {k,aksi:u.aksi};
  }
  return null;
}
function ujiTitik(wx,wy){
  const pg=peganganDi(wx,wy);
  if(pg) return {t:'pegangan',kunci:pg};
  const tu=tuasDi(wx,wy);
  if(tu) return {t:'tuas',k:tu.k,aksi:tu.aksi};
  const k=badanDi(wx,wy);
  if(k) return {t:'badan',k};
  const kw=kawatDi(wx,wy);
  if(kw) return {t:'kawat',...kw};
  return {t:'kosong'};
}

/* ===== titik cabang di tengah kawat =====================================
   Kawat dibelah menjadi dua, dan sebuah komponen 'simpul' diletakkan di
   titik potongnya. Karena semua pin berada di kelipatan kisi, garis kawat
   selalu melewati titik kisi, sehingga pembulatan tidak menggeser simpul
   keluar dari garisnya. Union-find tetap menangani sambungannya tanpa
   perubahan, dan graf kawat tetap berbentuk pohon. */
function proyeksiSegmen(pts,seg,wx,wy){
  const [ax,ay]=pts[seg],[bx,by]=pts[seg+1];
  const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy||1;
  let t=((wx-ax)*dx+(wy-ay)*dy)/L2; t=Math.max(0,Math.min(1,t));
  return [ax+dx*t,ay+dy*t];
}
function belahKawat(i,seg,wx,wy){
  const w=M.kawat[i]; if(!w||!w.jalur) return null;
  const pts=w.jalur;
  const [tx,ty]=proyeksiSegmen(pts,seg,wx,wy);
  const j=tambahKomponen('simpul',tx,ty);
  const a=w.a, b=w.b;
  /* Kedua belahan MEWARISI jalur aslinya, supaya penataan yang sudah rapi
     tidak berubah. Kalau titik cabang berada di segmen pertama, belahan
     depan sebetulnya lurus; begitu pula segmen terakhir untuk belahan
     belakang. Tanpa ini, keduanya kembali ke siku bawaan dan jalur yang
     sudah diatur ikut bergeser. */
  const orient=w.orient||'v';
  const m=(w.m===undefined||w.m===null)?(orient==='v'?pts[pts.length-1][0]:pts[pts.length-1][1]):w.m;
  const tegakSeg=Math.abs(pts[seg+1][0]-pts[seg][0])<1e-6;
  const depan = seg===0
    ? (tegakSeg?{orient:'v',m:pts[0][0]}:{orient:'h',m:pts[0][1]})
    : {orient,m};
  const belakang = seg===pts.length-2
    ? (tegakSeg?{orient:'v',m:pts[pts.length-1][0]}:{orient:'h',m:pts[pts.length-1][1]})
    : {orient,m};
  M.kawat.splice(i,1);
  M.kawat.push({a,b:j.id+':0',orient:depan.orient,m:depan.m,jalur:[]});
  M.kawat.push({a:j.id+':0',b,orient:belakang.orient,m:belakang.m,jalur:[]});
  return j;
}

/* Alat ukur diberi nama otomatis P1/V1/A1 agar bisa dikenali di kanvas
   maupun di osiloskop; kode k7 tidak memberi tahu apa pun. */
const NAMA_OTOMATIS={probe:'P',volt:'V',ampere:'A'};
function namaBaru(jenis){
  const aw=NAMA_OTOMATIS[jenis];
  let n=1;
  const dipakai=new Set(M.komponen.filter(k=>k.jenis===jenis).map(k=>k.prop.nama));
  while(dipakai.has(aw+n)) n++;
  return aw+n;
}
const namaAlat=k=>(k.prop&&k.prop.nama)?k.prop.nama:k.id;
function tambahKomponen(jenis,x,y){
  const def=JENIS[jenis];
  const k={id:'k'+(nomorBerikut++),jenis,x:bulat(x),y:bulat(y),rot:0,cx:0,
           prop:{...def.prop},pin:def.pin.map(()=>0)};
  if(NAMA_OTOMATIS[jenis]) k.prop.nama=namaBaru(jenis);
  M.komponen.push(k); return k;
}
function hapusKomponen(id){
  const kk=komponenOleh(id);
  if(kk&&kk.jenis==='simpul'){
    /* simpul dengan tepat dua kawat: gabungkan lagi agar jalur tidak putus */
    const kunci=id+':0';
    const ikut=M.kawat.filter(w=>w.a===kunci||w.b===kunci);
    if(ikut.length===2){
      const ujung=ikut.map(w=>w.a===kunci?w.b:w.a);
      M.kawat=M.kawat.filter(w=>!ikut.includes(w));
      M.komponen=M.komponen.filter(c=>c.id!==id);
      sambung(ujung[0],ujung[1]);
      if(dipilih&&dipilih.id===id) dipilih=null;
      return;
    }
  }
  M.komponen=M.komponen.filter(k=>k.id!==id);
  M.kawat=M.kawat.filter(w=>!w.a.startsWith(id+':')&&!w.b.startsWith(id+':'));
  if(dipilih&&dipilih.id===id) dipilih=null;
}
/* ===== penataan jalur otomatis ==========================================
   Jalur baru dipilih dari beberapa calon, dan yang menabrak kotak komponen
   paling sedikit yang dipakai. Sebelumnya jalur selalu siku mendatar-dulu,
   sehingga sering melintas tepat di atas komponen lain.
   ====================================================================== */
function kotakDunia(k){
  const b=JENIS[k.jenis].kotak;
  const t=[putar(k,b[0],b[1]),putar(k,b[2],b[1]),putar(k,b[2],b[3]),putar(k,b[0],b[3])];
  const xs=t.map(p=>p[0]), ys=t.map(p=>p[1]);
  return {x0:Math.min(...xs)-6,x1:Math.max(...xs)+6,
          y0:Math.min(...ys)-6,y1:Math.max(...ys)+6};
}
const segLewat=(ax,ay,bx,by,r)=>
  !(Math.max(ax,bx)<r.x0||Math.min(ax,bx)>r.x1||
    Math.max(ay,by)<r.y0||Math.min(ay,by)>r.y1);
function skorRute(orient,m,p,q,abaikan){
  const pts=jalurKawat({orient,m},p,q);
  let tabrak=0,panjang=0;
  for(let i=0;i<pts.length-1;i++){
    panjang+=Math.abs(pts[i+1][0]-pts[i][0])+Math.abs(pts[i+1][1]-pts[i][1]);
    for(const k of M.komponen){
      if(abaikan.has(k.id)) continue;
      if(segLewat(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],kotakDunia(k))) tabrak++;
    }
  }
  return tabrak*10000 + panjang + (pts.length-2)*8;
}
function rutekanOtomatis(w){
  const p=posPinKunci(w.a), q=posPinKunci(w.b);
  if(!p||!q) return;
  const abaikan=new Set([w.a.split(':')[0],w.b.split(':')[0]]);
  const mx=bulat((p[0]+q[0])/2), my=bulat((p[1]+q[1])/2);
  const calon=[['v',q[0]],['v',p[0]],['h',p[1]],['h',q[1]],['v',mx],['h',my]];
  for(const d of [-100,-60,-40,40,60,100]){
    calon.push(['v',mx+d]); calon.push(['h',my+d]);
  }
  let terbaik=null, skorMin=Infinity;
  for(const [o,m] of calon){
    const sk=skorRute(o,m,p,q,abaikan);
    if(sk<skorMin){ skorMin=sk; terbaik=[o,m] }
  }
  if(terbaik){ w.orient=terbaik[0]; w.m=terbaik[1] }
}
function sambung(a,b){
  if(a===b) return false;
  if(a.split(':')[0]===b.split(':')[0]) return false;
  if(M.kawat.some(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a))) return false;
  const w={a,b,jalur:[]};
  M.kawat.push(w);
  rutekanOtomatis(w);
  return true;
}

const bUndo=document.getElementById('bUndo'), bRedo=document.getElementById('bRedo');
let tumpukan=[], majuStack=[];
const potret=()=>JSON.stringify({aplikasi:APLIKASI,versi:VERSI_BERKAS,n:nomorBerikut,nama:namaProyek,
  k:M.komponen.map(k=>({id:k.id,jenis:k.jenis,x:k.x,y:k.y,rot:k.rot,cx:k.cx||0,prop:k.prop})),
  w:M.kawat.map(w=>({a:w.a,b:w.b,orient:w.orient,m:w.m}))});
/* Naikkan berkas lama ke bentuk terkini. Inilah guna penanda versi: bukan
   sekadar angka, tetapi jalan agar berkas siswa yang dibuat versi lama tetap
   bisa dibuka setelah bentuk datanya berubah. Mengembalikan null bila berkas
   dibuat oleh versi yang lebih baru daripada aplikasi ini. */
function migrasi(d){
  const v=d.versi||0;
  if(v>VERSI_BERKAS) return null;
  if(v===0){
    /* berkas sebelum penomoran: lengkapi sifat yang waktu itu belum ada */
    if(!d.nama) d.nama='Rangkaian lama';
    const hitung={};
    (d.k||[]).forEach(k=>{
      if(k.cx===undefined) k.cx=0;
      const aw={probe:'P',volt:'V',ampere:'A'}[k.jenis];
      if(aw){
        k.prop=k.prop||{};
        if(!k.prop.nama){ hitung[aw]=(hitung[aw]||0)+1; k.prop.nama=aw+hitung[aw] }
      }
    });
    d.versi=1;
  }
  return d;
}
function pakai(s){
  const d=typeof s==='string'?JSON.parse(s):s;
  nomorBerikut=d.n;
  if(d.nama) namaProyek=d.nama;
  M.komponen=d.k.map(k=>({...k,cx:k.cx||0,prop:{...k.prop},pin:JENIS[k.jenis].pin.map(()=>0)}));
  M.kawat=d.w.map(w=>({a:w.a,b:w.b,orient:w.orient,m:w.m,jalur:[]}));
  dipilih=null; pilihKawat=-1; pinTertunda=null; segarkan(); gambarIns();
}
function rekam(){
  tumpukan.push(potret());
  if(tumpukan.length>50) tumpukan.shift();
  majuStack.length=0; setRiwayat();
}
function setRiwayat(){
  bUndo.disabled=!tumpukan.length; bRedo.disabled=!majuStack.length;
  const a=document.getElementById('mUndo2'), b=document.getElementById('mRedo2');
  if(a) a.disabled=!tumpukan.length;
  if(b) b.disabled=!majuStack.length;
}
bUndo.addEventListener('click',()=>{
  if(!tumpukan.length) return; majuStack.push(potret()); pakai(tumpukan.pop()); setRiwayat();
});
bRedo.addEventListener('click',()=>{
  if(!majuStack.length) return; tumpukan.push(potret()); pakai(majuStack.pop()); setRiwayat();
});

const cv=document.getElementById('cv');
let ctx=cv.getContext('2d');
const gaya=getComputedStyle(document.documentElement), C={};
['copper','charge','silk','muted','hot','panel','panel-dark','panel-up','ok','pilih']
  .forEach(n=>C[n]=gaya.getPropertyValue('--'+n).trim());
let lebarCSS=0,tinggiCSS=0;
let dprTerpakai=0;
function ukur(){
  const r=cv.getBoundingClientRect();
  lebarCSS=r.width; tinggiCSS=r.height;
  const dpr=Math.min(devicePixelRatio||1,2.5);
  dprTerpakai=dpr;
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
/* ===== pemeriksaan diri setiap bingkai ====================================
   Kalau ukuran kanvas yang tercatat tidak lagi cocok dengan kotak CSS-nya
   atau dengan devicePixelRatio, gambar akan menyusut ke sudut dan
   meninggalkan coretan saat digeser — karena pengisian latar hanya menutupi
   sebagian bitmap. Ini pernah terjadi setelah aplikasi berpindah ke latar
   belakang di Android, dan pemicunya tidak selalu memicu ResizeObserver.
   Daripada menebak pemicunya, putaran gambar memeriksa sendiri: murah,
   dan menutup SEMUA pemicu sekaligus. */
function periksaUkuran(){
  const w=cv.clientWidth, h=cv.clientHeight;
  if(!w||!h) return false;
  const dpr=Math.min(devicePixelRatio||1,2.5);
  const cocok = Math.abs(w-lebarCSS)<1 && Math.abs(h-tinggiCSS)<1 &&
                Math.abs(dpr-dprTerpakai)<1e-6 &&
                Math.abs(cv.width-Math.round(w*dpr))<=1 &&
                Math.abs(cv.height-Math.round(h*dpr))<=1;
  if(!cocok){ ukur(); return true }
  return false;
}
const keDunia=(sx,sy)=>[sx/zoom+pan.x, sy/zoom+pan.y];

function garisJalur(pts,warna,tebal){
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.strokeStyle=warna; ctx.lineWidth=tbl(tebal);
  ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
}
/* ===== antrean label ======================================================
   Label tidak digambar di tempat, melainkan dikumpulkan dulu lalu digambar
   SETELAH seluruh transformasi komponen dilepas. Dua masalah selesai
   sekaligus:
   - teksnya tegak dengan sendirinya, tidak ikut berputar bersama simbol;
   - karena semuanya diketahui lebih dulu, yang bertabrakan bisa digeser
     atau disembunyikan menurut prioritas.
   prio 3 = bagian simbol (tanda kutub, huruf kaki) — tidak pernah digeser
   prio 2 = bacaan alat ukur        prio 1 = nilai komponen
   prio 0 = tegangan simpul (paling banyak, paling boleh mengalah)
   ========================================================================= */
const labelAntri=[];
let kompAktif=null;
const keLayar=(wx,wy)=>[(wx-pan.x)*zoom,(wy-pan.y)*zoom];
let ikonMode=false;
const UK_IKON=12;      /* di ikon hanya huruf simbol (>=12 px) yang digambar */
function antri(t,x,y,warna,uk,rata,prio,mono,alfa){
  const pr=prio===undefined?1:prio;
  if(ikonMode){
    /* Ikon hanya memuat huruf yang MELEKAT pada simbol dan cukup besar —
       yaitu A dan V di dalam lingkaran alat ukur. Nilai komponen, tanda
       kutub, dan huruf kaki tidak ikut supaya ikonnya bersih. */
    if(pr<3 || (uk||10)<UK_IKON) return;
    ctx.save();
    ctx.fillStyle=warna; if(alfa!==undefined&&alfa<1) ctx.globalAlpha=alfa;
    ctx.font=((uk||10)*skalaGaris)+'px '+
      (mono?'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace':'system-ui, sans-serif');
    ctx.textAlign=rata||'center'; ctx.textBaseline='middle';
    ctx.fillText(String(t),x,y);
    ctx.restore();
    return;
  }
  /* x,y masih dalam koordinat lokal komponen bila sedang menggambar komponen */
  const [wx,wy]=kompAktif?putar(kompAktif,x,y):[x,y];
  labelAntri.push({t:String(t),wx,wy,warna,uk:uk||10,rata:rata||'center',
                   prio:pr,mono:!!mono,alfa:alfa===undefined?1:alfa});
}
function tks(t,x,y,warna,uk,rata,prio){ antri(t,x,y,warna,uk||11,rata,prio,true) }
function sbl(t,x,y,rata,prio){ antri(t,x,y,C.muted,10,rata,prio,false) }

function tempatkanLabel(){
  if(!labelAntri.length) return;
  const kotak=[];
  const tabrak=b=>kotak.some(a=>!(b.x1<=a.x0||b.x0>=a.x1||b.y1<=a.y0||b.y0>=a.y1));
  labelAntri.sort((a,b)=>b.prio-a.prio);
  const geser=[0,-13,13,-26,26,-39,39].map(d=>d*FP());
  for(const L of labelAntri){
    const uk=L.uk*FP();
    ctx.font=uk+'px '+(L.mono
      ? 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'
      : 'system-ui, sans-serif');
    const w=ctx.measureText(L.t).width, h=uk*1.25;
    const [sx,sy]=keLayar(L.wx,L.wy);
    const x0 = L.rata==='left' ? sx : L.rata==='right' ? sx-w : sx-w/2;
    let pakai=null;
    if(L.prio>=3) pakai=0;
    else for(const dy of geser){
      const b={x0:x0-2,x1:x0+w+2,y0:sy+dy-h/2,y1:sy+dy+h/2};
      if(!tabrak(b)){ pakai=dy; break }
    }
    /* bacaan alat ukur terlalu penting untuk disembunyikan; nilai komponen
       dan tegangan simpul lebih baik mengalah daripada menumpuk */
    if(pakai===null){ if(L.prio>=2) pakai=geser[geser.length-1]; else continue }
    const y=sy+pakai;
    kotak.push({x0:x0-2,x1:x0+w+2,y0:y-h/2,y1:y+h/2});
    ctx.fillStyle=L.warna; ctx.textAlign=L.rata; ctx.textBaseline='middle';
    if(L.alfa<1) ctx.globalAlpha=L.alfa;
    ctx.fillText(L.t,sx,y);
    if(L.alfa<1) ctx.globalAlpha=1;
  }
  labelAntri.length=0;
}
/* ===== simbol ==============================================================
   Semua simbol memakai satu perangkat tetapan: ketebalan garis, ukuran
   badan, dan jarak label dihitung dari kotak komponen — bukan angka yang
   dipilih sendiri-sendiri seperti sebelumnya. Tujuannya agar skema terlihat
   digambar oleh satu tangan.
   ARTI WARNA (berlaku ketat di kanvas):
     tembaga = kawat dan badan komponen      emas  = arus dan muatan
     krem    = tegangan                      teal  = alat ukur
     biru    = pilihan & kendali (bukan besaran fisis)
   ========================================================================= */
/* Mode proyektor: menaikkan ketebalan garis dan ukuran huruf TANPA mengubah
   ukuran skemanya. Berbeda dari zoom — zoom membesarkan simbol sementara
   labelnya tetap seukuran layar, jadi di proyektor tulisannya tetap kecil. */
let proyektor=false;
const FP=()=>proyektor?1.5:1;
let skalaGaris=1;              /* dipakai saat menggambar ikon berskala kecil */
const tbl=v=>v*FP()*skalaGaris;
const TEBAL=2.4;        /* garis badan komponen */
const TEBAL_PLAT=3.2;   /* pelat & palang: baterai, kapasitor, basis, katoda */
const TEBAL_HALUS=1.7;  /* rincian kecil: panah, inti trafo */
const R_BULAT=15;       /* radius simbol bulat: alat ukur, sumber AC */
const AMP_GERIGI=9;     /* amplitudo gerigi resistor */

/* label utama di atas badan, label kedua di bawahnya — jaraknya sama untuk
   semua komponen karena diambil dari kotaknya */
const kotakDari=k=>JENIS[k.jenis].kotak;
function labelNama(k){
  const b=kotakDari(k);
  tks(namaAlat(k),(b[0]+b[2])/2,b[1]-9,C.ok,11,'center',2);
}
function labelAtas(k,t,prio){
  const b=kotakDari(k); sbl(t,(b[0]+b[2])/2,b[1]-8,'center',prio);
}
function labelBawah(k,t,warna,prio){
  const b=kotakDari(k);
  if(warna) tks(t,(b[0]+b[2])/2,b[3]+9,warna,11,'center',prio===undefined?1:prio);
  else      sbl(t,(b[0]+b[2])/2,b[3]+9,'center',prio);
}

function gSumber(k){
  garisJalur([[0,-P],[0,-16]],C.copper,TEBAL);
  garisJalur([[0,16],[0,P]],C.copper,TEBAL);
  ctx.strokeStyle=C.copper; ctx.lineCap='round';
  [[-16,17],[-8,10],[0,17],[8,10]].forEach(([y,w])=>{
    ctx.lineWidth=tbl(TEBAL_PLAT);ctx.beginPath();ctx.moveTo(-w,y);ctx.lineTo(w,y);ctx.stroke();
  });
  sbl('+',-26,-13,'center',3); sbl('−',-26,18,'center',3);
  labelAtas(k,fmtVolt(k.prop.E));
}
function gResistor(k){
  garisJalur([[-P,0],[-22,0]],C.copper,TEBAL);
  garisJalur([[22,0],[P,0]],C.copper,TEBAL);
  const pts=[[-22,0]], n=12;
  for(let i=1;i<=n;i++) pts.push([-22+44*(i-.5)/n,(i%2?-AMP_GERIGI:AMP_GERIGI)]);
  pts.push([22,0]); garisJalur(pts,C.copper,TEBAL);
  labelAtas(k,fmtOhm(k.prop.R));
}
function gSaklar(k){
  garisJalur([[-P,0],[-14,0]],C.copper,TEBAL);
  garisJalur([[14,0],[P,0]],C.copper,TEBAL);
  ctx.strokeStyle=C.copper;ctx.lineWidth=tbl(TEBAL);
  [[-14,0],[14,0]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,3.2,0,6.2832);ctx.stroke()});
  garisJalur(k.prop.tutup?[[-14,0],[14,0]]:[[-14,0],[11,-16]],C.copper,TEBAL);
  if(ikonMode) return;            /* ikon: simbol saja, tanpa tuas */
  /* tuas = kendali, bukan besaran fisis -> warna biru */
  const t=JENIS.saklar.tuas[0], r=px(11);
  garisJalur([[t.dx,t.dy+r],[0,-16]],'rgba(134,182,222,.45)',px(1.2));
  ctx.fillStyle=C['panel-dark'];
  ctx.beginPath();ctx.arc(t.dx,t.dy,r,0,6.2832);ctx.fill();
  ctx.strokeStyle=k.prop.tutup?C.ok:C.pilih;ctx.lineWidth=px(2);
  ctx.beginPath();ctx.arc(t.dx,t.dy,r,0,6.2832);ctx.stroke();
  ctx.lineWidth=px(2.2);
  ctx.beginPath();
  if(k.prop.tutup){ ctx.moveTo(t.dx-r*.45,t.dy); ctx.lineTo(t.dx+r*.45,t.dy) }
  else { ctx.moveTo(t.dx-r*.45,t.dy+r*.35); ctx.lineTo(t.dx+r*.45,t.dy-r*.45) }
  ctx.stroke();
}
function badanTransistor(k,npn){
  garisJalur([[-P,0],[-10,0]],C.copper,TEBAL);
  ctx.strokeStyle=C.copper;ctx.lineWidth=tbl(TEBAL_PLAT);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-10,-17);ctx.lineTo(-10,17);ctx.stroke();
  garisJalur([[-10,-9],[20,-26]],C.copper,TEBAL);
  garisJalur([[20,-26],[20,-P]],C.copper,TEBAL);
  garisJalur([[-10,9],[20,26]],C.copper,TEBAL);
  garisJalur([[20,26],[20,P]],C.copper,TEBAL);
  const x1=-10,y1=9,x2=20,y2=26, L=Math.hypot(x2-x1,y2-y1);
  const ux=(x2-x1)/L, uy=(y2-y1)/L;
  const [mx,my]=npn?[x1+ux*20,y1+uy*20]:[x1+ux*8,y1+uy*8];
  const sg=npn?1:-1;
  ctx.fillStyle=C.copper;
  ctx.beginPath();
  ctx.moveTo(mx,my);
  ctx.lineTo(mx-sg*ux*12-uy*6, my-sg*uy*12+ux*6);
  ctx.lineTo(mx-sg*ux*12+uy*6, my-sg*uy*12-ux*6);
  ctx.closePath();ctx.fill();
  sbl('B',-24,-9,'center',3); sbl('C',30,-30,'center',3); sbl('E',30,30,'center',3);
  if(terbaca()){
    const ic=hasil.arusKomp.get(k.id)||0, ib=hasil.arusKomp.get(k.id+'#b')||0;
    const vce=(hasil.V[hasil.net.petaSimpul.get(k.id+':1')]||0)
             -(hasil.V[hasil.net.petaSimpul.get(k.id+':2')]||0);
    const sgv=npn?1:-1;
    const kerja=Math.abs(ib)<1e-9?'mati':(sgv*vce<0.3?'jenuh':'aktif');
    labelBawah(k,kerja,kerja==='mati'?C.muted:(kerja==='aktif'?C.ok:C.silk));
    if(Math.abs(ib)>1e-9){
      const b=kotakDari(k);
      tks('Ib '+fmtA(ib),(b[0]+b[2])/2,b[3]+22,C.charge,10);
      tks('Ic '+fmtA(ic)+'  β '+km(Math.abs(ic/ib),0),(b[0]+b[2])/2,b[3]+34,C.charge,10);
    }
  }
}
function gNPN(k){ badanTransistor(k,true) }
function gPNP(k){ badanTransistor(k,false) }

function gPotensio(k){
  garisJalur([[-P,0],[-22,0]],C.copper,TEBAL);
  garisJalur([[22,0],[P,0]],C.copper,TEBAL);
  const pts=[[-22,0]], n=12;
  for(let i=1;i<=n;i++) pts.push([-22+44*(i-.5)/n,(i%2?-AMP_GERIGI:AMP_GERIGI)]);
  pts.push([22,0]); garisJalur(pts,C.copper,TEBAL);
  const kk=Math.min(Math.max(k.prop.pos,0),1);
  const xw=-22+44*kk;
  garisJalur([[0,-P],[0,-22]],C.copper,TEBAL);
  garisJalur([[0,-22],[xw,-13]],C.copper,TEBAL_HALUS);
  ctx.fillStyle=C.copper;
  ctx.beginPath();
  ctx.moveTo(xw,-13); ctx.lineTo(xw-4,-20); ctx.lineTo(xw+4,-20);
  ctx.closePath(); ctx.fill();
  labelBawah(k,fmtOhm(k.prop.R));
  if(ikonMode) return;            /* ikon: simbol saja, tanpa tuas */
  const r=px(11);
  JENIS.potensio.tuas.forEach(u=>{
    ctx.fillStyle=C['panel-dark'];
    ctx.beginPath();ctx.arc(u.dx,u.dy,r,0,6.2832);ctx.fill();
    ctx.strokeStyle=C.pilih;ctx.lineWidth=px(2);
    ctx.beginPath();ctx.arc(u.dx,u.dy,r,0,6.2832);ctx.stroke();
    ctx.lineWidth=px(2.2);
    ctx.beginPath();
    ctx.moveTo(u.dx-r*.45,u.dy); ctx.lineTo(u.dx+r*.45,u.dy);
    if(u.aksi==='tambah'){ ctx.moveTo(u.dx,u.dy-r*.45); ctx.lineTo(u.dx,u.dy+r*.45) }
    ctx.stroke();
  });
  tks(km(kk*100,0)+'%',0,-52,C.pilih,11,'center',2);
}
function gTrafo(k){
  ctx.lineCap='round';
  for(const [x,arah] of [[-14,-1],[14,1]]){
    const ujung=x<0?-P:P;
    garisJalur([[ujung,-P],[x,-P],[x,-24]],C.copper,TEBAL);
    garisJalur([[x,24],[x,P],[ujung,P]],C.copper,TEBAL);
    ctx.strokeStyle=C.copper; ctx.lineWidth=tbl(TEBAL);
    for(let i=0;i<4;i++){
      ctx.beginPath();
      ctx.arc(x,-18+i*12,6,arah>0?-Math.PI/2:Math.PI/2,arah>0?Math.PI/2:-Math.PI/2,false);
      ctx.stroke();
    }
  }
  ctx.strokeStyle='rgba(127,160,163,.7)'; ctx.lineWidth=tbl(TEBAL_HALUS);
  [-4,4].forEach(x=>{ctx.beginPath();ctx.moveTo(x,-26);ctx.lineTo(x,26);ctx.stroke()});
  sbl('P',-30,-P+9,'center',3); sbl('S',30,-P+9,'center',3);
  labelBawah(k,'1 : '+km(k.prop.n,k.prop.n<1?3:2));
}
function gOpamp(k){
  garisJalur([[-P,-20],[-24,-20]],C.copper,TEBAL);
  garisJalur([[-P,20],[-24,20]],C.copper,TEBAL);
  garisJalur([[24,0],[P,0]],C.copper,TEBAL);
  ctx.strokeStyle=C.copper; ctx.lineWidth=tbl(TEBAL); ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(-24,-28); ctx.lineTo(24,0); ctx.lineTo(-24,28); ctx.closePath();
  ctx.stroke();
  sbl('+',-16,-20,'center',3); sbl('−',-16,20,'center',3);
  labelBawah(k,'±'+km(k.prop.Vsat,0)+' V');
  if(terbaca()){
    const vo=hasil.V[hasil.net.petaSimpul.get(k.id+':2')]||0;
    tks(km(vo,2)+' V',0,-38,C.silk,11,'center',2);
  }
}

const WARNA_LED=['#E2564B','#5FC08A','#E9B949','#6FA8DC'];
function badanDioda(){
  garisJalur([[-P,0],[-11,0]],C.copper,TEBAL);
  garisJalur([[11,0],[P,0]],C.copper,TEBAL);
  ctx.fillStyle=C.copper;
  ctx.beginPath();ctx.moveTo(-11,-11);ctx.lineTo(11,0);ctx.lineTo(-11,11);
  ctx.closePath();ctx.fill();
}
function gDioda(k){
  badanDioda();
  ctx.strokeStyle=C.copper;ctx.lineWidth=tbl(TEBAL_PLAT);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(11,-11);ctx.lineTo(11,11);ctx.stroke();
  if(terbaca()){
    const i=hasil.arusKomp.get(k.id)||0;
    if(i>1e-6) labelBawah(k,'menghantar');
    else if(i<-1e-9) labelBawah(k,'menahan');
  }
}
function gLed(k){
  const w=WARNA_LED[k.prop.warna|0]||WARNA_LED[0];
  const i=terbaca()?Math.max(hasil.arusKomp.get(k.id)||0,0):0;
  const nyala=Math.min(Math.sqrt(i/0.02),1.4);
  if(nyala>0.02){
    const r=13+16*nyala;
    const g=ctx.createRadialGradient(0,0,2,0,0,r);
    g.addColorStop(0,w); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=Math.min(.16+.5*nyala,.7);
    ctx.fillStyle=g; ctx.beginPath();ctx.arc(0,0,r,0,6.2832);ctx.fill();
    ctx.globalAlpha=1;
  }
  badanDioda();
  ctx.strokeStyle=nyala>0.02?w:C.copper;ctx.lineWidth=tbl(TEBAL_PLAT);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(11,-11);ctx.lineTo(11,11);ctx.stroke();
  ctx.lineWidth=tbl(TEBAL_HALUS);
  for(const dx of [-4,3]){
    ctx.beginPath();ctx.moveTo(dx,-13);ctx.lineTo(dx+6,-20);ctx.stroke();
    ctx.beginPath();ctx.moveTo(dx+6,-20);ctx.lineTo(dx+2.5,-18.5);ctx.stroke();
    ctx.beginPath();ctx.moveTo(dx+6,-20);ctx.lineTo(dx+4.5,-16.5);ctx.stroke();
  }
  if(i>1e-5) labelBawah(k,fmtA(i),C.charge);
}
function gZener(k){
  badanDioda();
  garisJalur([[5,-11],[11,-11],[11,11],[17,11]],C.copper,TEBAL_PLAT);
  labelAtas(k,km(k.prop.Vz,1)+' V');
}
function gSumberAC(k){
  garisJalur([[0,-P],[0,-R_BULAT]],C.copper,TEBAL);
  garisJalur([[0,R_BULAT],[0,P]],C.copper,TEBAL);
  ctx.strokeStyle=C.copper;ctx.lineWidth=tbl(TEBAL);
  ctx.beginPath();ctx.arc(0,0,R_BULAT,0,6.2832);ctx.stroke();
  ctx.beginPath();
  for(let x=-9;x<=9;x+=1) (x===-9?ctx.moveTo:ctx.lineTo).call(ctx,x,-6*Math.sin(x/9*Math.PI));
  ctx.lineWidth=tbl(TEBAL_HALUS); ctx.stroke();
  sbl(fmtVolt(k.prop.Vp)+'p',R_BULAT+9,-6,'left');
  sbl(fmtHz(k.prop.f),R_BULAT+9,7,'left');
}
function gSimpul(){
  ctx.fillStyle=C.copper;
  ctx.beginPath();ctx.arc(0,0,4,0,6.2832);ctx.fill();
}
function bulatan(warna,huruf){
  ctx.strokeStyle=warna;ctx.lineWidth=tbl(TEBAL);
  ctx.beginPath();ctx.arc(0,0,R_BULAT,0,6.2832);ctx.stroke();
  tks(huruf,0,0,warna,13,'center',3);
}
const terbaca=()=>hasil&&hasil.ok;
/* penanda kecil: alat ini sedang dikirim ke layar skop */
function tandaSkop(k){
  if(!k.prop.skop) return;
  ctx.strokeStyle=C.pilih; ctx.lineWidth=tbl(TEBAL_HALUS); ctx.lineCap='round';
  ctx.beginPath();
  for(let x=-7;x<=7;x+=1){
    const y=-R_BULAT-8-3.5*Math.sin(x/7*Math.PI);
    (x===-7?ctx.moveTo:ctx.lineTo).call(ctx,x,y);
  }
  ctx.stroke();
}
/* Badan alat ukur berwarna teal; ANGKA-nya diwarnai menurut besarannya —
   emas untuk arus, krem untuk tegangan. */
function gAmpere(k){

function gVolt(k){

function gProbe(k){

  if(terbaca()) tks(km(nilaiAlat(k),2)+' V',29,-34,C.silk,11,'left',2);

function gKapasitor(k){
  garisJalur([[-P,0],[-6,0]],C.copper,TEBAL); garisJalur([[6,0],[P,0]],C.copper,TEBAL);
  ctx.strokeStyle=C.copper; ctx.lineWidth=tbl(TEBAL_PLAT); ctx.lineCap='butt';
  ctx.beginPath();ctx.moveTo(-6,-15);ctx.lineTo(-6,15);ctx.stroke();

function gInduktor(k){

function gMassa(){

  [[13,0],[8,6],[4,12]].forEach(([w,y])=>{
